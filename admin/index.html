<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RAAS Admin</title>
<style>
:root{--ink:#0a0a0a;--mut:#6b6b6b;--line:#e4e4e4;--soft:#f4f4f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fafafa}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:#000;padding:20px}
.login form{background:#fff;padding:36px;width:min(380px,100%);display:grid;gap:14px}
.login h1{font:600 28px Georgia,serif;letter-spacing:.3em;text-align:center}
input,select,textarea{border:1px solid var(--line);padding:10px 12px;background:#fff;width:100%;border-radius:4px}
textarea{resize:vertical}
input[type=color]{padding:2px;height:40px;width:56px}input[type=checkbox]{width:auto}input[type=range]{padding:0}
.b{background:#000;color:#fff;border:1px solid #000;padding:10px 18px;cursor:pointer;border-radius:4px;font-weight:500}
.b:hover{opacity:.85}.b.o{background:#fff;color:#000;border-color:#cfcfcf}.b.s{padding:5px 10px;font-size:12px}.b.d{background:#fff;color:#b00020;border-color:#e0b4bb}
.b[disabled]{opacity:.5;pointer-events:none}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#000;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .lg{font:600 24px Georgia,serif;letter-spacing:.3em;padding:0 10px 18px}
aside button{background:none;border:0;color:#bbb;text-align:left;padding:10px;cursor:pointer;border-radius:4px}
aside button:hover{color:#fff;background:#1a1a1a}aside button.on{background:#fff;color:#000}
main{padding:24px clamp(14px,3vw,34px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px}.mut{color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);padding:16px;border-radius:6px}
.card small{display:block;color:var(--mut);font-size:12px}.card b{font-size:24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:#000;min-height:2px;border-radius:2px 2px 0 0}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:500;background:var(--soft);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:#fafafa}
.th{width:44px;height:44px;object-fit:cover;background:var(--soft);border-radius:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft)}
.tag.pending{background:#fff3cd}.tag.confirmed,.tag.processing{background:#dbeafe}.tag.shipped{background:#e0e7ff}.tag.delivered{background:#d1fae5}.tag.cancelled{background:#fde2e2}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{width:auto;min-width:180px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:start center;overflow:auto;padding:30px 12px}
.mbox{background:#fff;width:min(560px,100%);padding:24px;border-radius:8px}.mbox.wide{width:min(900px,100%)}
.mbox h2{font-size:18px;margin-bottom:14px}
.f{display:grid;gap:5px;margin-bottom:12px}.f>span{font-size:12px;color:var(--mut)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.colb{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;background:#fcfcfc}
.colb .h{display:grid;grid-template-columns:1fr 56px 90px auto;gap:8px;margin-bottom:10px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.im{position:relative;width:74px;height:74px}.im img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.im button{position:absolute;top:2px;background:#fff;border:1px solid #ccc;border-radius:3px;font-size:10px;padding:0 4px;cursor:pointer}
.im .x{right:2px}.im .m{left:2px}
.addimg{width:74px;height:74px;border:1px dashed #aaa;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--mut);cursor:pointer;text-align:center}
.site{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;align-items:start}
.site .pane{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.pvw{background:#fff;border:1px solid var(--line);border-radius:6px;position:sticky;top:12px;overflow:hidden}
.pvw iframe{width:100%;height:calc(100vh - 120px);border:0;display:block;margin:0 auto;transition:width .3s}
.pvw.m iframe{width:390px;border-inline:1px solid var(--line)}
.cp{display:flex;gap:8px}
.mrow{display:flex;gap:8px;margin:6px 0}
.lay{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:#fcfcfc}
.lay label{font-size:12px;color:var(--mut);display:grid;gap:2px}
.mrow2{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;margin-bottom:6px;align-items:center}
.tg{display:flex;gap:10px;align-items:center;margin-bottom:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);background:#000;color:#fff;padding:12px 20px;border-radius:6px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#b00020}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside .lg{width:100%}.grid2,.site,.r2,.r3{grid-template-columns:1fr}.site .pane,.pvw{position:static;max-height:none}.pvw iframe{height:70vh}.colb .h{grid-template-columns:1fr 56px}}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="lf"><h1>RAAS</h1><p class="mut" style="text-align:center">Admin sign in</p>
    <input type="email" name="email" placeholder="Email" required autocomplete="username">
    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
    <button class="b" type="submit">Sign in</button><p id="lerr" style="color:#b00020;font-size:13px"></p></form>
</div>
<div class="shell" id="shell" hidden>
  <aside id="nav"></aside>
  <main><div class="top"><h1 id="vt"></h1><span class="mut" id="who"></span></div><div id="view"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"PKR "+Number(n||0).toLocaleString("en-PK");
const dt=d=>d?new Date(d).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"";
const toLocal=d=>{const x=new Date(d);return isNaN(x)?"":new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3800)}
const fail=e=>{console.error(e);toast(e&&e.message?e.message:String(e),true)};
const modal=(h,wide)=>{$("#mbox").className="mbox"+(wide?" wide":"");$("#mbox").innerHTML=h;$("#modal").hidden=false};
const closeModal=()=>{$("#modal").hidden=true;$("#mbox").innerHTML=""};
$("#modal").addEventListener("mousedown",e=>{if(e.target.id==="modal")closeModal()});

const cfgS=window.RAAS_SUPABASE||{};
if(!cfgS.url||!cfgS.anonKey){document.body.innerHTML='<p style="padding:40px;font:16px system-ui">Add your Supabase URL and anon key in <b>shared/supabase-config.js</b> first (see README).</p>';throw new Error("No Supabase config")}
const sb=supabase.createClient(cfgS.url,cfgS.anonKey);
let ME=null,S={};
const V={};
const NAV=[["dashboard","Dashboard"],["products","Products"],["inventory","Inventory"],["categories","Categories"],["orders","Orders"],["customers","Customers"],["coupons","Coupons"],["site","Website"],["account","Account"]];
const STATUSES=["pending","confirmed","processing","shipped","delivered","cancelled"];

async function up(file,folder="uploads"){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from("media").upload(path,file,{cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

/* ---------------- auth ---------------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  const {data:a,error}=await sb.from("admins").select("role").eq("user_id",session.user.id).maybeSingle();
  if(error||!a){await sb.auth.signOut();return showLogin("This account is not an administrator.")}
  ME={email:session.user.email,role:a.role};
  $("#login").hidden=true;$("#shell").hidden=false;$("#who").textContent=ME.email+" · "+ME.role;
  $("#nav").innerHTML='<div class="lg">RAAS</div>'+NAV.filter(n=>!(ME.role!=="owner"&&n[0]==="site")).map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join("")+'<button data-act="logout" style="margin-top:auto">Sign out</button>';
  go(location.hash.slice(1)||"dashboard");
}
function showLogin(msg){$("#shell").hidden=true;$("#login").hidden=false;$("#lerr").textContent=msg||""}
$("#lf").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);
  const {error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});
  if(error)return $("#lerr").textContent=error.message;start()});
async function go(n){
  if(!V[n])n="dashboard";
  location.hash=n;S.cur=n;
  $$("#nav [data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===n));
  $("#vt").textContent=(NAV.find(x=>x[0]===n)||[])[1]||"";
  $("#view").innerHTML='<p class="mut">Loading…</p>';
  try{await V[n]()}catch(e){fail(e);$("#view").innerHTML='<p class="mut">Could not load this page. Check the Supabase setup.</p>'}
}
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
  const a=e.target.closest("[data-act]");if(!a)return;
  const fn=ACT[a.dataset.act];if(fn){try{await fn(a,e)}catch(x){fail(x)}}
});
document.addEventListener("change",async e=>{
  const t=e.target;if(!t.dataset.chg)return;
  try{await CHG[t.dataset.chg](t,e)}catch(x){fail(x)}
});
const ACT={},CHG={};
ACT.logout=async()=>{await sb.auth.signOut();location.hash="";start()};
ACT.close=closeModal;

/* ---------------- dashboard ---------------- */
V.dashboard=async()=>{
  const [pr,or,hi]=await Promise.all([
    sb.from("products").select("id,active,product_colours(stock)"),
    sb.from("orders").select("number,customer_name,total,status,created_at").order("created_at",{ascending:false}).limit(1000),
    sb.from("order_history").select("status,note,at,orders(number)").order("at",{ascending:false}).limit(8)]);
  [pr,or,hi].forEach(r=>{if(r.error)throw r.error});
  const P=pr.data,O=or.data,H=hi.data,cnt=s=>O.filter(o=>o.status===s).length;
  const sales=O.filter(o=>o.status!=="cancelled").reduce((a,o)=>a+ +o.total,0);
  const out=P.filter(p=>!p.product_colours.some(c=>c.stock>0)).length;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d});
  const vals=days.map(d=>{const n=new Date(d);n.setDate(n.getDate()+1);return O.filter(o=>o.status!=="cancelled"&&new Date(o.created_at)>=d&&new Date(o.created_at)<n).reduce((a,o)=>a+ +o.total,0)});
  const mx=Math.max(...vals,1),card=(l,v)=>`<div class="card"><small>${l}</small><b>${v}</b></div>`;
  $("#view").innerHTML=`<div class="cards">${card("Total products",P.length)}${card("Active products",P.filter(p=>p.active).length)}${card("Out of stock",out)}${card("Total orders",O.length)}
    ${STATUSES.map(s=>card(s[0].toUpperCase()+s.slice(1),cnt(s))).join("")}${card("Total sales",money(sales))}</div>
    <div class="grid2"><div class="panel"><h3>Sales, last 7 days</h3><div class="bars">${vals.map((v,i)=>`<div title="${money(v)}"><i style="height:${v/mx*100}%"></i>${days[i].toLocaleDateString("en-GB",{weekday:"short"})}</div>`).join("")}</div></div>
    <div class="panel"><h3>Orders by status</h3>${STATUSES.map(s=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span style="width:90px">${s}</span><i style="display:block;height:10px;background:#000;width:${cnt(s)/Math.max(O.length,1)*100}%;min-width:2px"></i>${cnt(s)}</div>`).join("")}</div></div>
    <div class="grid2"><div class="panel"><h3>Recent orders</h3>${O.slice(0,6).map(o=>`<p>#${o.number} · ${esc(o.customer_name)} · ${money(o.total)} <span class="tag ${o.status}">${o.status}</span></p>`).join("")||'<p class="mut">No orders yet.</p>'}</div>
    <div class="panel"><h3>Recent activity</h3>${H.map(h=>`<p>Order #${h.orders?h.orders.number:"?"} → ${h.status} <span class="mut">${dt(h.at)}</span></p>`).join("")||'<p class="mut">Nothing yet.</p>'}</div></div>`;
};

/* ---------------- products ---------------- */
V.products=async()=>{
  const [p,c]=await Promise.all([sb.from("products").select("*,product_colours(*),categories(name)").order("created_at",{ascending:false}),sb.from("categories").select("*").order("sort")]);
  if(p.error)throw p.error;if(c.error)throw c.error;
  S.prods=p.data;S.cats=c.data;
  $("#view").innerHTML=`<div class="bar"><input id="pq" placeholder="Search products" data-chg="plist"><select id="pf" data-chg="plist"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="featured">Featured</option><option value="out">Out of stock</option></select><button class="b" data-act="newprod">+ Add product</button></div><div class="tw" id="plist"></div>`;
  $("#pq").addEventListener("input",drawProds);drawProds();
};
CHG.plist=()=>drawProds();
function drawProds(){
  const q=($("#pq").value||"").toLowerCase(),f=$("#pf").value;
  const rows=S.prods.filter(p=>p.name.toLowerCase().includes(q)&&(!f||(f==="active"?p.active:f==="inactive"?!p.active:f==="featured"?p.featured:!p.product_colours.some(c=>c.stock>0))));
  $("#plist").innerHTML=`<table><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th>Featured</th><th></th></tr>${rows.map(p=>{
    const cs=[...p.product_colours].sort((a,b)=>a.sort-b.sort),img=cs[0]&&cs[0].images[0],st=cs.reduce((a,c)=>a+c.stock,0);
    return `<tr><td>${img?`<img class="th" src="${esc(img)}">`:'<div class="th"></div>'}</td><td><b>${esc(p.name)}</b><br><span class="mut">${cs.length} colour${cs.length===1?"":"s"}</span></td><td>${esc(p.categories?p.categories.name:"—")}</td>
    <td>${p.price==null?'<span class="mut">not set</span>':money(p.price)}${p.discount_value!=null?`<br><span class="tag">${p.discount_type==="percent"?p.discount_value+"% off":"PKR "+p.discount_value+" off"}</span>`:""}</td>
    <td>${st}</td><td><input type="checkbox" ${p.active?"checked":""} data-chg="ptoggle" data-id="${p.id}" data-f="active"></td><td><input type="checkbox" ${p.featured?"checked":""} data-chg="ptoggle" data-id="${p.id}" data-f="featured"></td>
    <td style="white-space:nowrap"><button class="b o s" data-act="editprod" data-id="${p.id}">Edit</button> <button class="b o s" data-act="dupprod" data-id="${p.id}">Duplicate</button> <button class="b d s" data-act="delprod" data-id="${p.id}">Delete</button></td></tr>`}).join("")||'<tr><td colspan="8" class="mut">No products yet. Click "Add product".</td></tr>'}</table>`;
}
CHG.ptoggle=async t=>{const {error}=await sb.from("products").update({[t.dataset.f]:t.checked}).eq("id",t.dataset.id);if(error){t.checked=!t.checked;throw error}
  S.prods.find(p=>p.id===t.dataset.id)[t.dataset.f]=t.checked;toast("Saved")};
ACT.newprod=()=>prodForm(null);
ACT.editprod=a=>prodForm(a.dataset.id);
ACT.delprod=async a=>{if(!confirm("Delete this product and all its colours? This cannot be undone."))return;
  const {error}=await sb.from("products").delete().eq("id",a.dataset.id);if(error)throw error;toast("Deleted");V.products()};
ACT.dupprod=async a=>{
  const p=S.prods.find(x=>x.id===a.dataset.id),{id,created_at,categories,product_colours,...row}=p;
  const r=await sb.from("products").insert({...row,name:p.name+" (copy)",active:false,featured:false}).select("id").single();if(r.error)throw r.error;
  if(product_colours.length){const x=await sb.from("product_colours").insert(product_colours.map(({id,product_id,...c})=>({...c,stock:0,product_id:r.data.id})));if(x.error)throw x.error}
  toast("Duplicated as an inactive draft with zero stock");V.products()};
function prodForm(id){
  const p=id?S.prods.find(x=>x.id===id):{name:"",description:"",price:null,active:true,featured:false,specs:[],product_colours:[]};
  S.E={id,del:[],cols:[...p.product_colours].sort((a,b)=>a.sort-b.sort).map(c=>({id:c.id,name:c.name,hex:c.hex,stock:c.stock,images:[...(c.images||[])]}))};
  if(!S.E.cols.length)S.E.cols.push({name:"",hex:"#141414",stock:0,images:[]});
  const L=(t,h)=>`<label class="f"><span>${t}</span>${h}</label>`;
  modal(`<h2>${id?"Edit product":"New product"}</h2>
   ${L("Name",`<input id="pn" value="${esc(p.name)}">`)}
   <div class="r2">${L("Category",`<select id="pcat"><option value="">— none —</option>${S.cats.map(c=>`<option value="${c.id}" ${p.category_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`)}
   ${L("Price (PKR)",`<input id="pprice" type="number" min="0" value="${p.price??""}">`)}</div>
   ${L("Description",`<textarea id="pdesc" rows="3">${esc(p.description)}</textarea>`)}
   <div class="r3">${L("Discount",`<select id="pdt"><option value="">None</option><option value="percent" ${p.discount_type==="percent"?"selected":""}>Percent (%)</option><option value="fixed" ${p.discount_type==="fixed"?"selected":""}>Fixed (PKR)</option></select>`)}
   ${L("Starts",`<input id="pds" type="datetime-local" value="${p.discount_start?toLocal(p.discount_start):""}">`)}${L("Ends",`<input id="pde" type="datetime-local" value="${p.discount_end?toLocal(p.discount_end):""}">`)}</div>
   ${L("Discount value",`<input id="pdv" type="number" min="0" value="${p.discount_value??""}">`)}
   ${L("Specifications (one per line, e.g. Material: Leather)",`<textarea id="pspec" rows="3">${esc((p.specs||[]).map(s=>s.k+": "+s.v).join("\n"))}</textarea>`)}
   ${L("Product video (URL or upload)",`<div class="cp"><input id="pvid" value="${esc(p.video_url||"")}" placeholder="https://..."><label class="b o s" style="display:grid;place-items:center;white-space:nowrap">Upload<input type="file" accept="video/*" hidden data-chg="pvup"></label></div>`)}
   <div class="tg"><label><input type="checkbox" id="pact" ${p.active?"checked":""}> Visible on the website</label><label><input type="checkbox" id="pfeat" ${p.featured?"checked":""}> Featured</label></div>
   <h3 style="margin:8px 0">Colours, stock and photos <span class="mut" style="font-weight:400">(3–4 photos per colour; they also drive the rotate view)</span></h3>
   <div id="cols"></div><button class="b o s" data-act="addcol">+ Add colour</button>
   <div class="acts"><button class="b o" data-act="close">Cancel</button><button class="b" data-act="saveprod">Save product</button></div>`,true);
  drawCols();
}
CHG.pvup=async t=>{if(!t.files[0])return;toast("Uploading video…");$("#pvid").value=await up(t.files[0],"video");toast("Video uploaded")};
function drawCols(){
  $("#cols").innerHTML=S.E.cols.map((c,i)=>`<div class="colb" data-i="${i}"><div class="h"><input data-ci="${i}" data-cf="name" placeholder="Colour name" value="${esc(c.name)}"><input type="color" data-ci="${i}" data-cf="hex" value="${esc(c.hex)}"><input type="number" min="0" data-ci="${i}" data-cf="stock" placeholder="Stock" value="${c.stock}"><button class="b d s" data-act="delcol" data-i="${i}">Remove</button></div>
   <div class="imgs">${c.images.map((u,j)=>`<div class="im"><img src="${esc(u)}"><button class="m" data-act="imgmain" data-i="${i}" data-j="${j}" title="Make main">★</button><button class="x" data-act="imgdel" data-i="${i}" data-j="${j}">✕</button></div>`).join("")}
   <label class="addimg">+ Photos<input type="file" accept="image/*" multiple hidden data-chg="imgup" data-i="${i}"></label></div></div>`).join("");

$("#mbox").addEventListener("input",e=>{const t=e.target;if(t.dataset.ci!=null){const c=S.E.cols[+t.dataset.ci];c[t.dataset.cf]=t.dataset.cf==="stock"?Math.max(0,parseInt(t.value)||0):t.value}});
ACT.addcol=()=>{S.E.cols.push({name:"",hex:"#141414",stock:0,images:[]});drawCols()};
ACT.delcol=a=>{const c=S.E.cols[+a.dataset.i];if(S.E.cols.length<2)throw new Error("A product needs at least one colour");if(c.id)S.E.del.push(c.id);S.E.cols.splice(+a.dataset.i,1);drawCols()};
ACT.imgdel=a=>{S.E.cols[+a.dataset.i].images.splice(+a.dataset.j,1);drawCols()};
ACT.imgmain=a=>{const im=S.E.cols[+a.dataset.i].images,[u]=im.splice(+a.dataset.j,1);im.unshift(u);drawCols()};
CHG.imgup=async t=>{toast("Uploading…");const c=S.E.cols[+t.dataset.i];for(const f of t.files)c.images.push(await up(f,"products"));drawCols();toast("Uploaded")};
ACT.saveprod=async a=>{
  a.disabled=true;
  try{
    const v=i=>$("#"+i).value,dtp=v("pdt");
    const row={name:v("pn").trim(),category_id:v("pcat")||null,description:v("pdesc"),price:v("pprice")===""?null:+v("pprice"),
      discount_type:dtp||null,discount_value:dtp&&v("pdv")!==""?+v("pdv"):null,discount_start:v("pds")?new Date(v("pds")).toISOString():null,discount_end:v("pde")?new Date(v("pde")).toISOString():null,
      featured:$("#pfeat").checked,active:$("#pact").checked,video_url:v("pvid").trim()||null,
      specs:v("pspec").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(":");return i<0?{k:l,v:""}:{k:l.slice(0,i).trim(),v:l.slice(i+1).trim()}})};
    if(!row.name)throw new Error("Product name is required");
    let id=S.E.id;
    if(id){const r=await sb.from("products").update(row).eq("id",id);if(r.error)throw r.error}
    else{const r=await sb.from("products").insert(row).select("id").single();if(r.error)throw r.error;id=r.data.id}
    if(S.E.del.length){const r=await sb.from("product_colours").delete().in("id",S.E.del);if(r.error)throw r.error}
    const upd=[],ins=[];
    S.E.cols.forEach((c,i)=>{const r={name:c.name.trim()||"Colour "+(i+1),hex:c.hex,stock:Math.max(0,parseInt(c.stock)||0),images:c.images,sort:i,product_id:id};c.id?upd.push({...r,id:c.id}):ins.push(r)});
    if(upd.length){const r=await sb.from("product_colours").upsert(upd);if(r.error)throw r.error}
    if(ins.length){const r=await sb.from("product_colours").insert(ins);if(r.error)throw r.error}
    closeModal();toast("Product saved. It is live on the website.");V.products();
  }finally{a.disabled=false}
};

};
CHG.invlist=()=>drawInv();
function drawInv(){
  const f=$("#invf").value,rows=S.inv.filter(c=>!f||(f==="out"?c.stock===0:c.stock<=5));
  $("#invl").innerHTML=`<table><tr><th>Product</th><th>Colour</th><th>Available</th><th>Change stock</th></tr>${rows.map(c=>`<tr><td>${esc(c.products?c.products.name:"")}</td><td><i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${esc(c.hex)};border:1px solid #ccc"></i> ${esc(c.name)}</td>
   <td><b>${c.stock}</b> ${c.stock===0?'<span class="tag cancelled">out</span>':c.stock<=5?'<span class="tag pending">low</span>':""}</td>

async function setStock(id,val){if(val<0)throw new Error("Stock cannot go below zero");const r=await sb.from("product_colours").update({stock:val}).eq("id",id);if(r.error)throw r.error;S.inv.find(c=>c.id===id).stock=val;drawInv();toast("Stock updated")}
ACT.stk=a=>{const c=S.inv.find(x=>x.id===a.dataset.id),n=Math.max(1,parseInt($("#sd-"+c.id).value)||1);return setStock(c.id,c.stock+n*+a.dataset.d)};

/* ---------------- website customization (schema-driven, with live preview) ---------------- */
const getP=(o,k)=>k.split(".").reduce((a,x)=>a&&a[x],o);
const setP=(o,k,v)=>{const p=k.split(".");let a=o;while(p.length>1)a=a[p.shift()];a[p[0]]=v};
V.site=async()=>{
  if(ME.role!=="owner")throw new Error("Only owners can change the website");
  const r=await sb.from("site_config").select("data").eq("id","main").maybeSingle();if(r.error)throw r.error;
  S.draft=RAAS_merge(RAAS_DEFAULTS,(r.data&&r.data.data)||{});S.grp=S.grp||RAAS_SCHEMA[0].id;
  $("#view").innerHTML=`<div class="site"><div class="pane"><div class="panel"><select id="grp" data-chg="grp">${RAAS_SCHEMA.map(g=>`<option value="${g.id}" ${g.id===S.grp?"selected":""}>${g.title}</option>`).join("")}</select></div><div class="panel" id="sform"></div>
   <div class="acts" style="margin:0 0 20px;justify-content:flex-start"><button class="b" data-act="savesite">Save &amp; publish</button><button class="b o" data-act="discard">Discard changes</button><button class="b o" data-act="resetgrp">Reset section to defaults</button></div></div>
   <div class="pvw" id="pvw"><div class="bar" style="padding:8px;margin:0"><button class="b o s" data-act="pvd">Desktop</button><button class="b o s" data-act="pvm">Phone</button><a class="b o s" href="../index.html" target="_blank" style="text-decoration:none">Open site</a><span class="mut" style="align-self:center;font-size:12px">Live preview: changes show here instantly</span></div><iframe id="pv" src="../index.html?preview=1"></iframe></div></div>`;
  $("#pv").onload=()=>{pv();pvScroll()};drawGroup();
};
CHG.grp=t=>{S.grp=t.value;drawGroup();pvScroll()};
ACT.pvd=()=>$("#pvw").classList.remove("m");ACT.pvm=()=>$("#pvw").classList.add("m");
function pv(){clearTimeout(pv.t);pv.t=setTimeout(()=>{const f=$("#pv");f&&f.contentWindow&&f.contentWindow.postMessage({raasPreview:JSON.parse(JSON.stringify(S.draft))},"*")},120)}
const SCR={hero:"#top",layers:"#top",motion:"#top",ticker:".ticker",sections:"#wallets",sale:"#sale",banner:"#banner",about:"#about",contact:"footer",policies:"footer",footer:"footer",delivery:"#wallets",colours:"",seccolors:"",sizes:"",type:"",brand:"",announcement:"",text:""};
function pvScroll(){const f=$("#pv");f&&f.contentWindow&&f.contentWindow.postMessage({raasScroll:SCR[S.grp]||""},"*")}
const SECN={ticker:"Moving text band",sale:"Sale strip",banner:"Motion banner",wallets:"Products",about:"About"};
const isVid=u=>/\.(mp4|webm|mov)(\?|$)/i.test(u||"");
function drawGroup(){
  const g=RAAS_SCHEMA.find(x=>x.id===S.grp);$("#sform").innerHTML=`<h3>${g.title}</h3>`+g.fields.map(fld).join("");pv();
}
function fld(f){
  const v=getP(S.draft,f.k),k=`data-k="${f.k}"`,L=`<span>${esc(f.l)}</span>`;
  switch(f.t){
    case"text":return `<label class="f">${L}<input ${k} value="${esc(v)}"></label>`;
    case"textarea":return `<label class="f">${L}<textarea rows="4" ${k}>${esc(v)}</textarea></label>`;
    case"number":return `<label class="f">${L}<input type="number" min="0" ${k} data-t="number" value="${esc(v)}"></label>`;
    case"datetime":return `<label class="f">${L}<input type="datetime-local" ${k} data-t="datetime" value="${v?toLocal(v):""}"></label>`;
    case"color":return `<div class="f">${L}<div class="cp"><input type="color" ${k} data-t="color" value="${esc(v)}"><input ${k} data-t="color" value="${esc(v)}" maxlength="7" placeholder="#000000"></div></div>`;
    case"range":return `<label class="f">${L}<div class="cp"><input type="range" ${k} data-t="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"><output style="min-width:44px">${v}</output></div></label>`;
    case"toggle":return `<label class="tg"><input type="checkbox" ${k} data-t="toggle" ${v?"checked":""}> ${esc(f.l)}</label>`;
    case"select":return `<label class="f">${L}<select ${k} data-t="${typeof f.opts[0]==="number"?"numsel":"select"}">${f.opts.map(o=>`<option ${String(o)===String(v)?"selected":""}>${o}</option>`).join("")}</select></label>`;
    case"list":return `<label class="f">${L}<textarea rows="4" ${k} data-t="list">${esc((v||[]).join("\n"))}</textarea></label>`;
    case"image":case"video":case"media":return `<div class="f">${L}<input ${k} value="${esc(v)}" placeholder="https://… or upload"><div class="mrow"><label class="b o s">Upload<input type="file" hidden accept="${f.t==="video"?"video/*":f.t==="media"?"image/*,video/*":"image/*"}" data-chg="siteup" data-key="${f.k}" data-kind="${f.t}"></label><button class="b o s" data-act="clearmedia" data-key="${f.k}">Clear</button></div>${v?(isVid(v)?`<video src="${esc(v)}" muted controls style="height:80px"></video>`:`<img src="${esc(v)}" style="height:64px;background:#eee">`):""}</div>`;
    case"layers":return `<div class="f">${L}${(v||[]).map((x,i)=>`<div class="lay"><div class="mrow2" style="grid-template-columns:1fr auto auto"><input data-li="${i}" data-lf="src" placeholder="Image / GIF / video URL" value="${esc(x.src||"")}"><label class="b o s" style="display:inline-grid">Upload<input type="file" hidden accept="image/*,video/*" data-chg="layerup" data-i="${i}"></label><button class="b d s" data-act="layerdel" data-i="${i}">Remove</button></div>
      <div class="r2"><label>Left (%) <input type="range" min="0" max="100" data-li="${i}" data-lf="x" value="${x.x}"><output>${x.x}</output></label><label>Top (%) <input type="range" min="0" max="100" data-li="${i}" data-lf="y" value="${x.y}"><output>${x.y}</output></label>
      <label>Size (% of width) <input type="range" min="3" max="100" data-li="${i}" data-lf="w" value="${x.w}"><output>${x.w}</output></label><label>Opacity (%) <input type="range" min="5" max="100" data-li="${i}" data-lf="opacity" value="${x.opacity}"><output>${x.opacity}</output></label>
      <label>Movement <select data-li="${i}" data-lf="anim">${["float","spin","pulse","drift","none"].map(o=>`<option ${o===x.anim?"selected":""}>${o}</option>`).join("")}</select></label><label>Position <select data-li="${i}" data-lf="z">${["front","back"].map(o=>`<option ${o===x.z?"selected":""}>${o}</option>`).join("")}</select></label></div></div>`).join("")}<button class="b o s" data-act="layeradd">+ Add motion graphic</button></div>`;
    case"views":return `<div class="f">${L}${(v||[]).map((x,i)=>`<div class="mrow2"><input data-vi="${i}" data-vf="label" placeholder="Label (Back)" value="${esc(x.label||"")}"><input data-vi="${i}" data-vf="src" placeholder="Image URL" value="${esc(x.src||"")}"><label class="b o s">Upload<input type="file" hidden accept="image/*" data-chg="viewup" data-i="${i}"></label><button class="b d s" data-act="viewdel" data-i="${i}">✕</button></div>`).join("")}<button class="b o s" data-act="viewadd">+ Add view</button></div>`;
    case"sections":return `<div class="f">${L}${(v||[]).map((x,i)=>`<div class="mrow2" style="grid-template-columns:1fr auto auto auto"><b>${SECN[x.id]||x.id}</b><label><input type="checkbox" data-si="${i}" ${x.show?"checked":""}> show</label><button class="b o s" data-act="secmv" data-i="${i}" data-d="-1">↑</button><button class="b o s" data-act="secmv" data-i="${i}" data-d="1">↓</button></div>`).join("")}</div>`;
  }
  return "";
}
function coerce(t,el){
  switch(el.dataset.t){
    case"toggle":return el.checked;case"range":case"numsel":return +el.value;case"list":return el.value.split("\n").map(x=>x.trim()).filter(Boolean);
    case"number":return el.value===""?"":+el.value;case"datetime":return el.value?new Date(el.value).toISOString():"";
    case"color":return el.value;default:return el.value}
}
document.addEventListener("input",e=>{
  const t=e.target,form=t.closest("#sform");if(!form)return;
  if(t.dataset.li!=null){const Ly=S.draft.hero.layers[+t.dataset.li],f=t.dataset.lf;Ly[f]=["x","y","w","opacity"].includes(f)?+t.value:t.value;const o=t.parentElement.querySelector("output");if(o)o.textContent=t.value;return pv()}
  if(t.dataset.vi!=null){S.draft.hero.views[+t.dataset.vi][t.dataset.vf]=t.value;return pv()}
  if(t.dataset.si!=null){S.draft.sections[+t.dataset.si].show=t.checked;return pv()}
  const k=t.dataset.k;if(!k)return;
  let val=coerce(k,t);
  if(t.dataset.t==="color"){if(!/^#[0-9a-f]{6}$/i.test(val))return;$$(`[data-k="${k}"]`,form).forEach(x=>{if(x!==t)x.value=val})}
  if(t.dataset.t==="range"){const o=t.parentElement.querySelector("output");if(o)o.textContent=val}
  setP(S.draft,k,val);pv();
});
document.addEventListener("change",e=>{const t=e.target;if(t.closest("#sform")&&(t.type==="checkbox"||t.tagName==="SELECT")&&t.dataset.si==null){}});
CHG.siteup=async t=>{if(!t.files[0])return;toast("Uploading…");setP(S.draft,t.dataset.key,await up(t.files[0],t.dataset.kind==="video"?"video":"site"));drawGroup();toast("Uploaded")};
ACT.clearmedia=a=>{setP(S.draft,a.dataset.key,"");drawGroup()};
CHG.viewup=async t=>{if(!t.files[0])return;toast("Uploading…");S.draft.hero.views[+t.dataset.i].src=await up(t.files[0],"site");drawGroup();toast("Uploaded")};
CHG.layerup=async t=>{if(!t.files[0])return;toast("Uploading…");S.draft.hero.layers[+t.dataset.i].src=await up(t.files[0],"site");drawGroup();toast("Uploaded")};
ACT.layeradd=()=>{S.draft.hero.layers.push({src:"",x:50,y:50,w:20,opacity:100,anim:"float",z:"front"});drawGroup()};
ACT.layerdel=a=>{S.draft.hero.layers.splice(+a.dataset.i,1);drawGroup()};
ACT.viewadd=()=>{S.draft.hero.views.push({label:"",src:""});drawGroup()};
ACT.viewdel=a=>{S.draft.hero.views.splice(+a.dataset.i,1);drawGroup()};
ACT.secmv=a=>{const i=+a.dataset.i,j=i+ +a.dataset.d,s=S.draft.sections;if(j<0||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];drawGroup()};
ACT.savesite=async a=>{a.disabled=true;try{const r=await sb.from("site_config").upsert({id:"main",data:S.draft,updated_at:new Date().toISOString()});if(r.error)throw r.error;toast("Published. The website is updated.")}finally{a.disabled=false}};
ACT.discard=()=>V.site();
ACT.resetgrp=()=>{if(!confirm("Reset this section to the original defaults? (Not saved until you press Save & publish.)"))return;
  RAAS_SCHEMA.find(x=>x.id===S.grp).fields.forEach(f=>setP(S.draft,f.k,JSON.parse(JSON.stringify(getP(RAAS_DEFAULTS,f.k)))));drawGroup()};

/* ---------------- account ---------------- */
V.account=async()=>{
  $("#view").innerHTML=`<div class="panel" style="max-width:420px"><h3>${esc(ME.email)}</h3><p class="mut">Role: ${ME.role}</p>
   <h3 style="margin-top:18px">Change password</h3><label class="f"><span>New password (min 8 characters)</span><input type="password" id="np" autocomplete="new-password"></label><label class="f"><span>Repeat</span><input type="password" id="np2" autocomplete="new-password"></label>
   <button class="b" data-act="chpw">Update password</button></div>`;
};
ACT.chpw=async()=>{const a=$("#np").value;if(a.length<8)throw new Error("Use at least 8 characters");if(a!==$("#np2").value)throw new Error("Passwords do not match");
  const r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;$("#np").value=$("#np2").value="";toast("Password updated")};

addEventListener("hashchange",()=>{if(ME&&location.hash.slice(1)!==S.cur)go(location.hash.slice(1))});
start();
</script>
</body>
