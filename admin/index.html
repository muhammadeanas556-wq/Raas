<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RAAS Admin</title>
<style>
:root{--ink:#0a0a0a;--mut:#6b6b6b;--line:#e4e4e4;--soft:#f4f4f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fafafa}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:#000;padding:20px}
.login form{background:#fff;padding:36px;width:min(380px,100%);display:grid;gap:14px}
.login h1{font:600 28px Georgia,serif;letter-spacing:.3em;text-align:center}
input,select,textarea{border:1px solid var(--line);padding:10px 12px;background:#fff;width:100%;border-radius:4px}
textarea{resize:vertical}
input[type=color]{padding:2px;height:40px;width:56px}input[type=checkbox]{width:auto}input[type=range]{padding:0}
.b{background:#000;color:#fff;border:1px solid #000;padding:10px 18px;cursor:pointer;border-radius:4px;font-weight:500}
.b:hover{opacity:.85}.b.o{background:#fff;color:#000;border-color:#cfcfcf}.b.s{padding:5px 10px;font-size:12px}.b.d{background:#fff;color:#b00020;border-color:#e0b4bb}
.b[disabled]{opacity:.5;pointer-events:none}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#000;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .lg{font:600 24px Georgia,serif;letter-spacing:.3em;padding:0 10px 18px}
aside button{background:none;border:0;color:#bbb;text-align:left;padding:10px;cursor:pointer;border-radius:4px}
aside button:hover{color:#fff;background:#1a1a1a}aside button.on{background:#fff;color:#000}
main{padding:24px clamp(14px,3vw,34px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px}.mut{color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);padding:16px;border-radius:6px}
.card small{display:block;color:var(--mut);font-size:12px}.card b{font-size:24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:#000;min-height:2px;border-radius:2px 2px 0 0}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:500;background:var(--soft);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:#fafafa}
.th{width:44px;height:44px;object-fit:cover;background:var(--soft);border-radius:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft)}
.tag.pending{background:#fff3cd}.tag.confirmed,.tag.processing{background:#dbeafe}.tag.shipped{background:#e0e7ff}.tag.delivered{background:#d1fae5}.tag.cancelled{background:#fde2e2}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{width:auto;min-width:180px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:start center;overflow:auto;padding:30px 12px}
.mbox{background:#fff;width:min(560px,100%);padding:24px;border-radius:8px}.mbox.wide{width:min(900px,100%)}
.mbox h2{font-size:18px;margin-bottom:14px}
.f{display:grid;gap:5px;margin-bottom:12px}.f>span{font-size:12px;color:var(--mut)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.colb{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;background:#fcfcfc}
.colb .h{display:grid;grid-template-columns:1fr 200px 90px auto;gap:8px;margin-bottom:10px;align-items:center}
.hexf{display:flex;gap:8px;align-items:center}.hexf input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.04em}
.hexf input::placeholder{text-transform:none;letter-spacing:0}
.swatch{flex:none;width:40px;height:40px;border-radius:6px;border:1px solid #d6d6d6;box-shadow:inset 0 0 0 2px #fff}
.swatch.empty{background:repeating-conic-gradient(#e9e9e9 0 25%,#fff 0 50%) 0 0/12px 12px!important}
input.bad{border-color:#b00020!important;background:#fff8f8}
.hexerr{color:#b00020;font-size:12px;margin:-4px 0 4px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.im{position:relative;width:74px;height:74px}.im img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.im button{position:absolute;top:2px;background:#fff;border:1px solid #ccc;border-radius:3px;font-size:10px;padding:0 4px;cursor:pointer}
.im .x{right:2px}.im .m{left:2px}
.addimg{width:74px;height:74px;border:1px dashed #aaa;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--mut);cursor:pointer;text-align:center}
.site{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;align-items:start}
.site .pane{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.pvw{background:#fff;border:1px solid var(--line);border-radius:6px;position:sticky;top:12px;overflow:hidden}
.pvw iframe{width:100%;height:calc(100vh - 120px);border:0;display:block;margin:0 auto;transition:width .3s}
.pvw.m iframe{width:390px;border-inline:1px solid var(--line)}
.cp{display:flex;gap:8px}
.mrow{display:flex;gap:8px;margin:6px 0}
.lay{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:#fcfcfc}
.lay label{font-size:12px;color:var(--mut);display:grid;gap:2px}
.mrow2{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;margin-bottom:6px;align-items:center}
.tg{display:flex;gap:10px;align-items:center;margin-bottom:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);background:#000;color:#fff;padding:12px 20px;border-radius:6px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#b00020}
.tbar{display:flex;gap:6px;flex-wrap:wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.b.on{background:#000;color:#fff;border-color:#000}.b.o.on{background:#000;color:#fff}
.pvw .bar{border-bottom:1px solid var(--line)}.panel a{color:#2563eb}
#pdbox{border:1px solid var(--line);border-radius:6px;padding:12px;margin:12px 0;background:#fcfcfc;transition:opacity .2s}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside .lg{width:100%}.grid2,.site,.r2,.r3{grid-template-columns:1fr}.site .pane,.pvw{position:static;max-height:none}.pvw iframe{height:70vh}.colb .h{grid-template-columns:1fr 1fr}.colb .h>input:first-child{grid-column:1/-1}.colb .h>button{grid-column:1/-1;justify-self:end}}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%}}
.specrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.mainimg{display:flex;gap:12px;align-items:center}.mainimg .im{position:relative;width:96px;height:96px}.mainimg .im img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.mainimg .x{position:absolute;top:4px;right:4px;background:#000;color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.wsw{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fcfcfc;margin-bottom:12px;flex-wrap:wrap}
@media(max-width:640px){.specrow{grid-template-columns:1fr auto}.specrow input:nth-child(2){grid-column:1/2}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="lf"><h1>RAAS</h1><p class="mut" style="text-align:center">Admin sign in</p>
    <input type="email" name="email" placeholder="Email" required autocomplete="username">
    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
    <button class="b" type="submit">Sign in</button><p id="lerr" style="color:#b00020;font-size:13px"></p></form>
</div>
<div class="shell" id="shell" hidden>
  <aside id="nav"></aside>
  <main><div class="top"><h1 id="vt"></h1><span class="mut" id="who"></span></div><div id="view"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/raas-extras.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"PKR "+Number(n||0).toLocaleString("en-PK");
const dt=d=>d?new Date(d).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"";
const toLocal=d=>{const x=new Date(d);return isNaN(x)?"":new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3800)}
const fail=e=>{console.error(e);toast(e&&e.message?e.message:String(e),true)};
const modal=(h,wide)=>{$("#mbox").className="mbox"+(wide?" wide":"");$("#mbox").innerHTML=h;$("#modal").hidden=false};
const closeModal=()=>{$("#modal").hidden=true;$("#mbox").innerHTML=""};
$("#modal").addEventListener("mousedown",e=>{if(e.target.id==="modal")closeModal()});

const cfgS=window.RAAS_SUPABASE||{};
if(!cfgS.url||!cfgS.anonKey){document.body.innerHTML='<p style="padding:40px;font:16px system-ui">Add your Supabase URL and anon key in <b>shared/supabase-config.js</b> first (see README).</p>';throw new Error("No Supabase config")}
const sb=supabase.createClient(cfgS.url,cfgS.anonKey);
let ME=null,S={};
const V={};
const NAV=[["dashboard","Dashboard"],["products","Products"],["inventory","Inventory"],["categories","Categories"],["orders","Orders"],["customers","Customers"],["coupons","Coupons & Discounts"],["wallet","Hero Display (video / image)"],["editor","Visual Editor"],["site","Website"],["account","Account"]];
const STATUSES=["pending","confirmed","processing","shipped","delivered","cancelled"];

async function up(file,folder="uploads"){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from("media").upload(path,file,{cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

/* ---------------- auth ---------------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  const {data:a,error}=await sb.from("admins").select("role").eq("user_id",session.user.id).maybeSingle();
  if(error||!a){await sb.auth.signOut();return showLogin("This account is not an administrator.")}
  ME={email:session.user.email,role:a.role};
  $("#login").hidden=true;$("#shell").hidden=false;$("#who").textContent=ME.email+" · "+ME.role;
  $("#nav").innerHTML='<div class="lg">RAAS</div>'+NAV.filter(n=>!(ME.role!=="owner"&&["site","wallet","editor"].includes(n[0]))).map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join("")+'<button data-act="logout" style="margin-top:auto">Sign out</button>';
  go(location.hash.slice(1)||"dashboard");
}
function showLogin(msg){$("#shell").hidden=true;$("#login").hidden=false;$("#lerr").textContent=msg||""}
$("#lf").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);
  const {error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});
  if(error)return $("#lerr").textContent=error.message;start()});
async function go(n){
  if(!V[n])n="dashboard";
  location.hash=n;S.cur=n;
  $$("#nav [data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===n));
  $("#vt").textContent=(NAV.find(x=>x[0]===n)||[])[1]||"";
  $("#view").innerHTML='<p class="mut">Loading…</p>';
  try{await V[n]()}catch(e){fail(e);$("#view").innerHTML='<p class="mut">Could not load this page. Check the Supabase setup.</p>'}
}
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
  const a=e.target.closest("[data-act]");if(!a)return;
  const fn=ACT[a.dataset.act];if(fn){try{await fn(a,e)}catch(x){fail(x)}}
});
document.addEventListener("change",async e=>{
  const t=e.target;if(!t.dataset.chg)return;
  try{await CHG[t.dataset.chg](t,e)}catch(x){fail(x)}
});
const ACT={},CHG={};
ACT.logout=async()=>{await sb.auth.signOut();location.hash="";start()};
ACT.close=closeModal;

/* ---------------- dashboard ---------------- */
V.dashboard=async()=>{
  const [pr,or,hi]=await Promise.all([
    sb.from("products").select("id,active,product_colours(stock)"),
    sb.from("orders").select("number,customer_name,total,status,created_at").order("created_at",{ascending:false}).limit(1000),
    sb.from("order_history").select("status,note,at,orders(number)").order("at",{ascending:false}).limit(8)]);
  [pr,or,hi].forEach(r=>{if(r.error)throw r.error});
  const P=pr.data,O=or.data,H=hi.data,cnt=s=>O.filter(o=>o.status===s).length;
  const sales=O.filter(o=>o.status!=="cancelled").reduce((a,o)=>a+ +o.total,0);
  const out=P.filter(p=>!p.product_colours.some(c=>c.stock>0)).length;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d});
  const vals=days.map(d=>{const n=new Date(d);n.setDate(n.getDate()+1);return O.filter(o=>o.status!=="cancelled"&&new Date(o.created_at)>=d&&new Date(o.created_at)<n).reduce((a,o)=>a+ +o.total,0)});
  const mx=Math.max(...vals,1),card=(l,v)=>`<div class="card"><small>${l}</small><b>${v}</b></div>`;
  $("#view").innerHTML=`<div class="cards">${card("Total products",P.length)}${card("Active products",P.filter(p=>p.active).length)}${card("Out of stock",out)}${card("Total orders",O.length)}
    ${STATUSES.map(s=>card(s[0].toUpperCase()+s.slice(1),cnt(s))).join("")}${card("Total sales",money(sales))}</div>
    <div class="grid2"><div class="panel"><h3>Sales, last 7 days</h3><div class="bars">${vals.map((v,i)=>`<div title="${money(v)}"><i style="height:${v/mx*100}%"></i>${days[i].toLocaleDateString("en-GB",{weekday:"short"})}</div>`).join("")}</div></div>
    <div class="panel"><h3>Orders by status</h3>${STATUSES.map(s=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span style="width:90px">${s}</span><i style="display:block;height:10px;background:#000;width:${cnt(s)/Math.max(O.length,1)*100}%;min-width:2px"></i>${cnt(s)}</div>`).join("")}</div></div>
    <div class="grid2"><div class="panel"><h3>Recent orders</h3>${O.slice(0,6).map(o=>`<p>#${o.number} · ${esc(o.customer_name)} · ${money(o.total)} <span class="tag ${o.status}">${o.status}</span></p>`).join("")||'<p class="mut">No orders yet.</p>'}</div>
    <div class="panel"><h3>Recent activity</h3>${H.map(h=>`<p>Order #${h.orders?h.orders.number:"?"} → ${h.status} <span class="mut">${dt(h.at)}</span></p>`).join("")||'<p class="mut">Nothing yet.</p>'}</div></div>`;
};

/* ---------------- Wallets section ON/OFF (no code changes needed) ---------------- */
const walletsCat=()=>(S.cats||[]).find(c=>c.slug==="wallets");
function walletSwitch(){const w=walletsCat();
  return `<div class="wsw"><label class="tg" style="margin:0"><input type="checkbox" data-chg="walletsw" ${w&&w.active?"checked":""}> <b>Wallets section on the website</b></label><span class="mut">${w&&w.active?"ON – visitors can see the Wallets category.":"OFF – the Wallets category and its products are hidden from the public website."}</span></div>`}
CHG.walletsw=async t=>{
  const on=t.checked,w=walletsCat();
  const r=w?await sb.from("categories").update({active:on}).eq("id",w.id):await sb.from("categories").insert({slug:"wallets",name:"Wallets",sort:2,active:on});
  if(r.error){t.checked=!on;throw r.error}
  const c=await sb.from("categories").select("*").order("sort");if(!c.error)S.cats=c.data;
  toast(on?"Wallets section is now ON":"Wallets section is now OFF");
  const sp=t.closest(".wsw").querySelector(".mut");sp.textContent=on?"ON – visitors can see the Wallets category.":"OFF – the Wallets category and its products are hidden from the public website."};

/* ---------------- products ---------------- */
V.products=async()=>{
  const [p,c]=await Promise.all([sb.from("products").select("*,product_colours(*),categories(name)").order("created_at",{ascending:false}),sb.from("categories").select("*").order("sort")]);
  if(p.error)throw p.error;if(c.error)throw c.error;
  S.prods=p.data;S.cats=c.data;
  $("#view").innerHTML=walletSwitch()+`<div class="bar"><input id="pq" placeholder="Search products" data-chg="plist"><select id="pf" data-chg="plist"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="featured">Featured</option><option value="out">Out of stock</option></select><button class="b" data-act="newprod">+ Add product</button></div><div class="tw" id="plist"></div>`;
  $("#pq").addEventListener("input",drawProds);drawProds();
};
CHG.plist=()=>drawProds();
function drawProds(){
  const q=($("#pq").value||"").toLowerCase(),f=$("#pf").value;
  const rows=S.prods.filter(p=>p.name.toLowerCase().includes(q)&&(!f||(f==="active"?p.active:f==="inactive"?!p.active:f==="featured"?p.featured:!p.product_colours.some(c=>c.stock>0))));
  $("#plist").innerHTML=`<table><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th>Featured</th><th></th></tr>${rows.map(p=>{
    const cs=[...p.product_colours].sort((a,b)=>a.sort-b.sort),img=p.image||(cs[0]&&cs[0].images[0]),st=cs.reduce((a,c)=>a+c.stock,0);
    return `<tr><td>${img?`<img class="th" src="${esc(img)}">`:'<div class="th"></div>'}</td><td><b>${esc(p.name)}</b><br><span class="mut">${cs.length} colour${cs.length===1?"":"s"}</span></td><td>${esc(p.categories?p.categories.name:"—")}</td>
    <td>${discCell(p)}</td>
    <td>${st}</td><td><input type="checkbox" ${p.active?"checked":""} data-chg="ptoggle" data-id="${p.id}" data-f="active"></td><td><input type="checkbox" ${p.featured?"checked":""} data-chg="ptoggle" data-id="${p.id}" data-f="featured"></td>
    <td style="white-space:nowrap"><button class="b o s" data-act="editprod" data-id="${p.id}">Edit</button> <button class="b o s" data-act="dupprod" data-id="${p.id}">Duplicate</button> ${p.discount_value!=null?`<button class="b o s" data-act="rmdiscrow" data-id="${p.id}">Remove discount</button> `:""}<button class="b d s" data-act="delprod" data-id="${p.id}">Delete</button></td></tr>`}).join("")||'<tr><td colspan="8" class="mut">No products yet. Click "Add product".</td></tr>'}</table>`;
}
CHG.ptoggle=async t=>{const {error}=await sb.from("products").update({[t.dataset.f]:t.checked}).eq("id",t.dataset.id);if(error){t.checked=!t.checked;throw error}
  S.prods.find(p=>p.id===t.dataset.id)[t.dataset.f]=t.checked;toast("Saved")};
ACT.newprod=()=>prodForm(null);
ACT.editprod=a=>prodForm(a.dataset.id);
ACT.delprod=async a=>{if(!confirm("Delete this product and all its colours? This cannot be undone."))return;
  const {error}=await sb.from("products").delete().eq("id",a.dataset.id);if(error)throw error;toast("Deleted");V.products()};
ACT.dupprod=async a=>{
  const p=S.prods.find(x=>x.id===a.dataset.id),{id,created_at,categories,product_colours,...row}=p;
  const r=await sb.from("products").insert({...row,name:p.name+" (copy)",active:false,featured:false}).select("id").single();if(r.error)throw r.error;
  if(product_colours.length){const x=await sb.from("product_colours").insert(product_colours.map(({id,product_id,...c})=>({...c,stock:0,product_id:r.data.id})));if(x.error)throw x.error}
  toast("Duplicated as an inactive draft with zero stock");V.products()};
function prodForm(id){

/* HEX colour codes: "#000080", "000080", "#fff" are accepted and saved as "#000080" / "#FFFFFF" */
const normHex=v=>{let h=String(v||"").trim().replace(/^#/,"");if(!/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h))return null;if(h.length===3)h=h.replace(/./g,"$&$&");return "#"+h.toUpperCase()};
const HEX_MSG="Enter a valid HEX code, e.g. #000080, #FFFFFF or #FF5733";
/* updates one colour's swatch the moment its HEX code changes. strict=true also flags incomplete codes (on leaving the field / saving) */
function paintHex(i,strict){
  const c=S.E.cols[i],inp=$(`#cols input[data-ci="${i}"][data-cf="hex"]`),sw=$("#sw-"+i),er=$("#he-"+i);if(!inp||!sw)return;
  const v=String(c.hex||"").trim(),n=normHex(v),typing=!strict&&/^#?[0-9a-f]{0,5}$/i.test(v);
  sw.style.backgroundColor=n||"";sw.classList.toggle("empty",!n);sw.title=n||"No valid colour yet";
  const bad=!n&&!(typing||(!strict&&!v));inp.classList.toggle("bad",bad);er.hidden=!bad;
}

    <div class="hexf"><i class="swatch" id="sw-${i}" aria-hidden="true"></i><input data-ci="${i}" data-cf="hex" value="${esc(normHex(c.hex)||c.hex||"")}" placeholder="HEX e.g. #000080" maxlength="7" spellcheck="false" autocomplete="off" aria-label="HEX colour code"></div>
    <input type="number" min="0" data-ci="${i}" data-cf="stock" placeholder="Stock" value="${c.stock}" aria-label="Stock"><button class="b d s" type="button" data-act="delcol" data-i="${i}">Remove</button></div><p class="hexerr" id="he-${i}" hidden>${HEX_MSG}</p></div>`).join("");
  S.E.cols.forEach((_,i)=>paintHex(i));
  const t=$("#tstock");if(t)t.textContent=S.E.cols.reduce((a,c)=>a+(+c.stock||0),0);
}

ACT.saveprod=async a=>{
  a.disabled=true;
  try{
    const v=i=>$("#"+i).value,dtp=$("#pden").checked?v("pdt"):"";
    const row={name:v("pn").trim(),category_id:v("pcat")||null,description:v("pdesc"),price:v("pprice")===""?null:+v("pprice"),sale_price:v("psale")===""?null:+v("psale"),sku:v("psku").trim()||null,image:S.E.image||null,
      discount_type:dtp||null,discount_value:dtp&&v("pdv")!==""?+v("pdv"):null,discount_start:dtp&&v("pds")?new Date(v("pds")).toISOString():null,discount_end:dtp&&v("pde")?new Date(v("pde")).toISOString():null,
      featured:$("#pfeat").checked,active:v("pact")==="1",video_url:v("pvid").trim()||null,
      specs:S.E.specs.map(x=>({k:x.k.trim(),v:x.v.trim()})).filter(x=>x.k&&x.v)};
    if(!row.name)throw new Error("Product name is required");
    const badHex=S.E.cols.findIndex(c=>!normHex(c.hex));
    if(badHex>-1){paintHex(badHex,true);const f=$(`#cols input[data-ci="${badHex}"][data-cf="hex"]`);f&&f.focus();
      throw new Error(`Colour ${badHex+1}${S.E.cols[badHex].name.trim()?" ("+S.E.cols[badHex].name.trim()+")":""}: ${HEX_MSG}`)}
    if(row.sale_price!=null){if(row.price==null)throw new Error("Enter the product price before a discounted price");if(!(row.sale_price<row.price))throw new Error("The discounted price must be lower than the product price")}
    if(dtp){if(row.price==null)throw new Error("Enter the original price before adding a discount");const dv=row.discount_value;
      if(!(dv>0))throw new Error("Enter a discount value above zero, or switch the discount off");
      if(dtp==="percent"&&dv>99)throw new Error("A percentage discount must be between 1 and 99");
      if(dtp==="fixed"&&(!Number.isInteger(dv)||dv>=row.price))throw new Error("A fixed discount must be a whole number smaller than the price");
      if(row.discount_start&&row.discount_end&&row.discount_end<=row.discount_start)throw new Error("The discount end date must be after the start date")}
    let id=S.E.id;
    if(id){const r=await sb.from("products").update(row).eq("id",id);if(r.error)throw r.error}
    else{const r=await sb.from("products").insert(row).select("id").single();if(r.error)throw r.error;id=r.data.id}
    if(S.E.del.length){const r=await sb.from("product_colours").delete().in("id",S.E.del);if(r.error)throw r.error}
    const upd=[],ins=[];
    S.E.cols.forEach((c,i)=>{const r={name:c.name.trim()||"Colour "+(i+1),hex:normHex(c.hex),stock:Math.max(0,parseInt(c.stock)||0),images:[],sort:i,product_id:id};c.id?upd.push({...r,id:c.id}):ins.push(r)});
    if(upd.length){const r=await sb.from("product_colours").upsert(upd);if(r.error)throw r.error}
    if(ins.length){const r=await sb.from("product_colours").insert(ins);if(r.error)throw r.error}
    closeModal();toast("Product saved. It is live on the website.");V.products();
  }finally{a.disabled=false}
};

/* ---------------- coupons & discounts ---------------- */
const CP_SCOPES={all:"Entire website",products:"Specific products",categories:"Specific categories"};
function cpStatus(c){const now=Date.now();
  if(!c.active)return ["Inactive","cancelled"];
  if(c.ends_at&&Date.parse(c.ends_at)<=now)return ["Expired","cancelled"];
  if(c.starts_at&&Date.parse(c.starts_at)>now)return ["Scheduled","pending"];
  if(c.max_uses!=null&&c.used>=c.max_uses)return ["Used up","cancelled"];
  return ["Live","delivered"]}
const cpValue=c=>c.type==="percent"?(+c.value)+"%":money(c.value);
function cpScope(c){
  const names=(ids,list)=>(ids||[]).map(id=>(list.find(x=>x.id===id)||{name:"(deleted)"}).name);
  if(c.scope==="products"){const n=names(c.product_ids,S.cpProds);return `<b>${n.length} product${n.length===1?"":"s"}</b><br><span class="mut">${esc(n.slice(0,2).join(", "))}${n.length>2?" +"+(n.length-2):""}</span>`}
  if(c.scope==="categories"){const n=names(c.category_ids,S.cats);return `<b>Categories</b><br><span class="mut">${esc(n.join(", "))}</span>`}
  return "Entire website"}
V.coupons=async()=>{
  const [r,p,c]=await Promise.all([sb.from("coupons").select("*").order("created_at",{ascending:false}),sb.from("products").select("id,name,category_id,active").order("name"),sb.from("categories").select("*").order("sort")]);
  [r,p,c].forEach(x=>{if(x.error)throw x.error});
  S.coupons=r.data;S.cpProds=p.data;S.cats=c.data;
  const st=S.coupons.map(cpStatus).map(x=>x[0]),n=k=>st.filter(x=>x===k).length,card=(l,v)=>`<div class="card"><small>${l}</small><b>${v}</b></div>`;
  $("#view").innerHTML=`<div class="cards">${card("Coupons",S.coupons.length)}${card("Live now",n("Live"))}${card("Scheduled",n("Scheduled"))}${card("Expired / used up",n("Expired")+n("Used up"))}${card("Inactive",n("Inactive"))}${card("Times used",S.coupons.reduce((a,c)=>a+(c.used||0),0))}</div>
   <div class="bar"><input id="kq" placeholder="Search coupon code"><select id="kf" data-chg="cplist"><option value="">All statuses</option>${["Live","Scheduled","Expired","Used up","Inactive"].map(s=>`<option>${s}</option>`).join("")}</select><button class="b" data-act="newcoupon">+ Create coupon</button></div>
   <div class="tw" id="klist"></div>`;
  $("#kq").addEventListener("input",drawCoupons);drawCoupons();
};
CHG.cplist=()=>drawCoupons();
function drawCoupons(){
  const q=($("#kq").value||"").trim().toUpperCase(),f=$("#kf").value;
  const rows=S.coupons.filter(c=>c.code.toUpperCase().includes(q)&&(!f||cpStatus(c)[0]===f));
  $("#klist").innerHTML=`<table><tr><th>Code</th><th>Discount</th><th>Applies to</th><th>Min. order</th><th>Valid</th><th>Used</th><th>Status</th><th>Active</th><th></th></tr>${rows.map(c=>{const s=cpStatus(c);
    return `<tr><td><b style="font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em">${esc(c.code)}</b></td><td><b>${cpValue(c)}</b>${c.type==="percent"?"":' <span class="mut">fixed</span>'}</td><td>${cpScope(c)}</td>
    <td>${c.min_order!=null?money(c.min_order):'<span class="mut">none</span>'}</td>
    <td style="white-space:nowrap">${c.starts_at?dt(c.starts_at):"Any time"}<br><span class="mut">→ ${c.ends_at?dt(c.ends_at):"no expiry"}</span></td>
    <td>${c.used||0}${c.max_uses!=null?" / "+c.max_uses:' <span class="mut">/ ∞</span>'}</td><td><span class="tag ${s[1]}">${s[0]}</span></td>
    <td><input type="checkbox" ${c.active?"checked":""} data-chg="cptoggle" data-id="${c.id}" aria-label="Active"></td>
    <td style="white-space:nowrap"><button class="b o s" data-act="editcoupon" data-id="${c.id}">Edit</button> <button class="b d s" data-act="delcoupon" data-id="${c.id}">Delete</button></td></tr>`}).join("")||`<tr><td colspan="9" class="mut">${S.coupons.length?"No coupons match.":'No coupons yet. Click "Create coupon".'}</td></tr>`}</table>`;
}
CHG.cptoggle=async t=>{const {error}=await sb.from("coupons").update({active:t.checked}).eq("id",t.dataset.id);if(error){t.checked=!t.checked;throw error}
  S.coupons.find(c=>c.id===t.dataset.id).active=t.checked;drawCoupons();toast(t.checked?"Coupon activated":"Coupon deactivated")};
ACT.newcoupon=()=>couponForm(null);ACT.editcoupon=a=>couponForm(a.dataset.id);
function couponForm(id){
  const c=id?S.coupons.find(x=>x.id===id):{code:"",type:"percent",value:10,scope:"all",product_ids:[],category_ids:[],starts_at:null,ends_at:null,max_uses:null,min_order:null,used:0,active:true};
  S.E={id,scope:c.scope||"all",pids:new Set(c.product_ids||[]),cids:new Set(c.category_ids||[]),used:c.used||0};
  const L=(t,h,hint)=>`<label class="f"><span>${t}</span>${h}${hint?`<small class="mut" style="font-size:12px">${hint}</small>`:""}</label>`;
  modal(`<h2>${id?"Edit coupon":"Create coupon"}</h2>
   <div class="r2">${L("Coupon code",`<div class="cp"><input id="kc" value="${esc(c.code)}" placeholder="e.g. WELCOME10" maxlength="30" spellcheck="false" autocomplete="off" style="text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em"><button class="b o s" type="button" data-act="gencode" style="white-space:nowrap">Generate</button></div>`,"Letters, numbers, - and _ (3 to 30 characters). Customers can type it in any letter case.")}
   ${L("Status",`<select id="ka"><option value="1" ${c.active?"selected":""}>Active</option><option value="0" ${!c.active?"selected":""}>Inactive</option></select>`)}</div>
   <div class="r2">${L("Discount type",`<select id="kt" data-chg="cpcalc"><option value="percent" ${c.type!=="fixed"?"selected":""}>Percentage (%)</option><option value="fixed" ${c.type==="fixed"?"selected":""}>Fixed amount (PKR)</option></select>`)}
   ${L("Discount amount",`<input id="kv" type="number" min="1" max="100" step="1" value="${c.value??""}">`)}</div>
   <p id="kcalc" class="mut" style="margin:-4px 0 12px"></p>
   <div class="f"><span>Coupon applies to</span><div class="tabs" style="margin:0">${Object.entries(CP_SCOPES).map(([k,l])=>`<button type="button" class="b o s ${S.E.scope===k?"on":""}" data-act="cpscope" data-s="${k}">${l}</button>`).join("")}</div></div>
   <div id="kpick"></div>
   <div class="r2">${L("Start date (optional)",`<input id="ks" type="datetime-local" value="${c.starts_at?toLocal(c.starts_at):""}">`,"Empty = active immediately")}
   ${L("Expiry date (optional)",`<input id="ke" type="datetime-local" value="${c.ends_at?toLocal(c.ends_at):""}">`,"Empty = never expires")}</div>
   <div class="r2">${L("Usage limit (optional)",`<input id="km" type="number" min="1" step="1" value="${c.max_uses??""}" placeholder="Unlimited">`,`Total times this code can be used by all customers.${id?` Used so far: <b>${S.E.used}</b>.`:""}`)}
   ${L("Minimum order amount (optional, PKR)",`<input id="kmin" type="number" min="0" step="1" value="${c.min_order??""}" placeholder="No minimum">`,"Checked against the cart subtotal.")}</div>
   <div class="acts"><button class="b o" data-act="close">Cancel</button><button class="b" data-act="savecoupon">${id?"Save changes":"Create coupon"}</button></div>`,true);
  drawPick();cpCalc();
  $("#kv").addEventListener("input",cpCalc);
}
CHG.cpcalc=()=>{$("#kv").max=$("#kt").value==="percent"?100:"";cpCalc()};
function cpCalc(){const t=$("#kt").value,v=+$("#kv").value,ex=5000;
  if(!(v>0)){$("#kcalc").textContent="";return}
  const d=t==="percent"?Math.round(ex*Math.min(v,100)/100):Math.min(ex,v);
  $("#kcalc").textContent=`Example: an order of ${money(ex)} → ${money(d)} off → customer pays ${money(ex-d)}${S.E.scope!=="all"?" (only for the selected "+(S.E.scope==="products"?"products":"categories")+")":""}.`}
ACT.gencode=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];$("#kc").value=s};
ACT.cpscope=a=>{S.E.scope=a.dataset.s;$$("[data-act=cpscope]").forEach(b=>b.classList.toggle("on",b===a));drawPick();cpCalc()};
function drawPick(){
  const box=$("#kpick");if(S.E.scope==="all"){box.innerHTML="";return}
  const isP=S.E.scope==="products",list=isP?S.cpProds:S.cats,set=isP?S.E.pids:S.E.cids;
  box.innerHTML=`<div class="panel" style="padding:12px"><div class="cp" style="margin-bottom:8px"><input id="kps" placeholder="Search ${isP?"products":"categories"}"><span class="mut" style="align-self:center;white-space:nowrap" id="kpn"></span></div>
    <div id="kpl" style="max-height:220px;overflow:auto;display:grid;gap:2px"></div></div>`;
  const draw=()=>{const q=$("#kps").value.toLowerCase();
    $("#kpl").innerHTML=list.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<label class="tg" style="margin:0;padding:6px 4px;border-bottom:1px solid var(--line)"><input type="checkbox" data-chg="cppick" value="${x.id}" ${set.has(x.id)?"checked":""}> ${esc(x.name)}${x.active===false?' <span class="mut">(hidden)</span>':""}</label>`).join("")||`<p class="mut">No ${isP?"products":"categories"} found.</p>`;
    $("#kpn").textContent=set.size+" selected"};
  $("#kps").addEventListener("input",draw);draw();
}
CHG.cppick=t=>{const set=S.E.scope==="products"?S.E.pids:S.E.cids;t.checked?set.add(t.value):set.delete(t.value);$("#kpn").textContent=set.size+" selected"};
ACT.savecoupon=async a=>{
  const v=i=>$("#"+i).value.trim(),num=i=>v(i)===""?null:+v(i);
  const row={code:v("kc").toUpperCase(),type:v("kt"),value:num("kv"),scope:S.E.scope,
    product_ids:S.E.scope==="products"?[...S.E.pids]:[],category_ids:S.E.scope==="categories"?[...S.E.cids]:[],
    starts_at:v("ks")?new Date(v("ks")).toISOString():null,ends_at:v("ke")?new Date(v("ke")).toISOString():null,
    max_uses:num("km"),min_order:num("kmin"),active:v("ka")==="1"};
  if(!/^[A-Z0-9_-]{3,30}$/.test(row.code))throw new Error("Coupon code: use 3 to 30 letters, numbers, - or _ (no spaces)");
  if(!(row.value>0))throw new Error("Enter a discount amount above zero");
  if(row.type==="percent"&&row.value>100)throw new Error("A percentage discount cannot be more than 100%");
  if(row.scope==="products"&&!row.product_ids.length)throw new Error("Select at least one product, or choose Entire website");
  if(row.scope==="categories"&&!row.category_ids.length)throw new Error("Select at least one category, or choose Entire website");
  if(row.starts_at&&row.ends_at&&row.ends_at<=row.starts_at)throw new Error("The expiry date must be after the start date");
  if(row.max_uses!=null&&(!Number.isInteger(row.max_uses)||row.max_uses<1))throw new Error("Usage limit must be a whole number of 1 or more (or empty for unlimited)");
  if(row.max_uses!=null&&row.max_uses<S.E.used&&!confirm(`This coupon was already used ${S.E.used} times, more than the new limit of ${row.max_uses}. It will stop working. Continue?`))return;
  if(row.min_order!=null&&!(row.min_order>=0))throw new Error("Minimum order amount cannot be negative");
  if(!S.E.id&&row.ends_at&&Date.parse(row.ends_at)<=Date.now()&&!confirm("The expiry date is in the past, so this coupon will not work. Save anyway?"))return;
  a.disabled=true;
  try{
    const r=S.E.id?await sb.from("coupons").update(row).eq("id",S.E.id):await sb.from("coupons").insert(row);
    if(r.error){if(r.error.code==="23505")throw new Error(`A coupon with the code ${row.code} already exists`);throw r.error}
    closeModal();toast(S.E.id?"Coupon saved":"Coupon created");V.coupons();
  }finally{a.disabled=false}
};
ACT.delcoupon=async a=>{const c=S.coupons.find(x=>x.id===a.dataset.id);
  if(!confirm(`Delete coupon ${c?c.code:""}? Customers will no longer be able to use it. Orders that already used it are kept.`))return;
  const r=await sb.from("coupons").delete().eq("id",a.dataset.id);if(r.error)throw r.error;toast("Coupon deleted");V.coupons()};

const getP=(o,k)=>k.split(".").reduce((a,x)=>a&&a[x],o);
const setP=(o,k,v)=>{const p=k.split(".");let a=o;while(p.length>1)a=a[p.shift()];a[p[0]]=v};
V.site=async()=>{
  if(ME.role!=="owner")throw new Error("Only owners can change the website");
  const r=await sb.from("site_config").select("data").eq("id","main").maybeSingle();if(r.error)throw r.error;
  S.draft=RAAS_merge(RAAS_DEFAULTS,(r.data&&r.data.data)||{});S.grp=S.grp||RAAS_SCHEMA[0].id;
  $("#view").innerHTML=`<div class="site"><div class="pane"><div class="panel"><select id="grp" data-chg="grp">${RAAS_SCHEMA.map(g=>`<option value="${g.id}" ${g.id===S.grp?"selected":""}>${g.title}</option>`).join("")}</select></div><div class="panel" id="sform"></div>
   <div class="acts" style="margin:0 0 20px;justify-content:flex-start"><button class="b" data-act="savesite">Save &amp; publish</button><button class="b o" data-act="discard">Discard changes</button><button class="b o" data-act="resetgrp">Reset section to defaults</button></div></div>

  $("#pv").onload=()=>{pv();pvScroll()};drawGroup();
};
CHG.grp=t=>{S.grp=t.value;drawGroup();pvScroll()};
ACT.pvd=()=>$("#pvw").classList.remove("m");ACT.pvm=()=>$("#pvw").classList.add("m");
function pv(){clearTimeout(pv.t);pv.t=setTimeout(()=>{const f=$("#pv");f&&f.contentWindow&&f.contentWindow.postMessage({raasPreview:JSON.parse(JSON.stringify(S.draft))},"*")},120)}
const SCR={hero:"#top",layers:"#top",motion:"#top",ticker:".ticker",sections:"#shop",sale:"#sale",banner:"#banner",about:"#about",contact:"footer",policies:"footer",footer:"footer",delivery:"#shop",colours:"",seccolors:"",sizes:"",type:"",brand:"",announcement:"",text:""};
function pvScroll(){const f=$("#pv");f&&f.contentWindow&&f.contentWindow.postMessage({raasScroll:SCR[S.grp]||""},"*")}
const SECN={ticker:"Moving text band",sale:"Sale strip",banner:"Motion banner",shop:"Products",about:"About"};
const isVid=u=>/\.(mp4|webm|mov)(\?|$)/i.test(u||"");
function drawGroup(){
  const g=RAAS_SCHEMA.find(x=>x.id===S.grp);$("#sform").innerHTML=`<h3>${g.title}</h3>`+g.fields.map(fld).join("");pv();
}
function fld(f){
  const v=getP(S.draft,f.k),k=`data-k="${f.k}"`,L=`<span>${esc(f.l)}</span>`;
  switch(f.t){
    case"text":return `<label class="f">${L}<input ${k} value="${esc(v)}"></label>`;
    case"textarea":return `<label class="f">${L}<textarea rows="4" ${k}>${esc(v)}</textarea></label>`;
    case"number":return `<label class="f">${L}<input type="number" min="0" ${k} data-t="number" value="${esc(v)}"></label>`;
    case"datetime":return `<label class="f">${L}<input type="datetime-local" ${k} data-t="datetime" value="${v?toLocal(v):""}"></label>`;
    case"color":return `<div class="f">${L}<div class="cp"><input type="color" ${k} data-t="color" value="${esc(v)}"><input ${k} data-t="color" value="${esc(v)}" maxlength="7" placeholder="#000000"></div></div>`;
    case"range":return `<label class="f">${L}<div class="cp"><input type="range" ${k} data-t="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"><output style="min-width:44px">${v}</output></div></label>`;
    case"toggle":return `<label class="tg"><input type="checkbox" ${k} data-t="toggle" ${v?"checked":""}> ${esc(f.l)}</label>`;
    case"select":return `<label class="f">${L}<select ${k} data-t="${typeof f.opts[0]==="number"?"numsel":"select"}">${f.opts.map(o=>`<option ${String(o)===String(v)?"selected":""}>${o}</option>`).join("")}</select></label>`;
    case"list":return `<label class="f">${L}<textarea rows="4" ${k} data-t="list">${esc((v||[]).join("\n"))}</textarea></label>`;
    case"image":case"video":case"media":return `<div class="f">${L}<input ${k} value="${esc(v)}" placeholder="https://… or upload"><div class="mrow"><label class="b o s">Upload<input type="file" hidden accept="${f.t==="video"?"video/*":f.t==="media"?"image/*,video/*":"image/*"}" data-chg="siteup" data-key="${f.k}" data-kind="${f.t}"></label><button class="b o s" data-act="clearmedia" data-key="${f.k}">Clear</button></div>${v?(isVid(v)?`<video src="${esc(v)}" muted controls style="height:80px"></video>`:`<img src="${esc(v)}" style="height:64px;background:#eee">`):""}</div>`;
    case"layers":return `<div class="f">${L}${(v||[]).map((x,i)=>`<div class="lay"><div class="mrow2" style="grid-template-columns:1fr auto auto"><input data-li="${i}" data-lf="src" placeholder="Image / GIF / video URL" value="${esc(x.src||"")}"><label class="b o s" style="display:inline-grid">Upload<input type="file" hidden accept="image/*,video/*" data-chg="layerup" data-i="${i}"></label><button class="b d s" data-act="layerdel" data-i="${i}">Remove</button></div>
      <div class="r2"><label>Left (%) <input type="range" min="0" max="100" data-li="${i}" data-lf="x" value="${x.x}"><output>${x.x}</output></label><label>Top (%) <input type="range" min="0" max="100" data-li="${i}" data-lf="y" value="${x.y}"><output>${x.y}</output></label>
      <label>Size (% of width) <input type="range" min="3" max="100" data-li="${i}" data-lf="w" value="${x.w}"><output>${x.w}</output></label><label>Opacity (%) <input type="range" min="5" max="100" data-li="${i}" data-lf="opacity" value="${x.opacity}"><output>${x.opacity}</output></label>
      <label>Movement <select data-li="${i}" data-lf="anim">${["float","spin","pulse","drift","none"].map(o=>`<option ${o===x.anim?"selected":""}>${o}</option>`).join("")}</select></label><label>Position <select data-li="${i}" data-lf="z">${["front","back"].map(o=>`<option ${o===x.z?"selected":""}>${o}</option>`).join("")}</select></label></div></div>`).join("")}<button class="b o s" data-act="layeradd">+ Add motion graphic</button></div>`;
    case"views":return `<div class="f">${L}${(v||[]).map((x,i)=>`<div class="mrow2"><input data-vi="${i}" data-vf="label" placeholder="Label (Back)" value="${esc(x.label||"")}"><input data-vi="${i}" data-vf="src" placeholder="Image URL" value="${esc(x.src||"")}"><label class="b o s">Upload<input type="file" hidden accept="image/*" data-chg="viewup" data-i="${i}"></label><button class="b d s" data-act="viewdel" data-i="${i}">✕</button></div>`).join("")}<button class="b o s" data-act="viewadd">+ Add view</button></div>`;
    case"sections":return `<div class="f">${L}${(v||[]).map((x,i)=>`<div class="mrow2" style="grid-template-columns:1fr auto auto auto"><b>${SECN[x.id]||x.id}</b><label><input type="checkbox" data-si="${i}" ${x.show?"checked":""}> show</label><button class="b o s" data-act="secmv" data-i="${i}" data-d="-1">↑</button><button class="b o s" data-act="secmv" data-i="${i}" data-d="1">↓</button></div>`).join("")}</div>`;
  }
  return "";
}
function coerce(t,el){
  switch(el.dataset.t){
    case"toggle":return el.checked;case"range":case"numsel":return +el.value;case"list":return el.value.split("\n").map(x=>x.trim()).filter(Boolean);
    case"number":return el.value===""?"":+el.value;case"datetime":return el.value?new Date(el.value).toISOString():"";
    case"color":return el.value;default:return el.value}
}
document.addEventListener("input",e=>{
  const t=e.target,form=t.closest("#sform");if(!form)return;
  if(t.dataset.li!=null){const Ly=S.draft.hero.layers[+t.dataset.li],f=t.dataset.lf;Ly[f]=["x","y","w","opacity"].includes(f)?+t.value:t.value;const o=t.parentElement.querySelector("output");if(o)o.textContent=t.value;return pv()}
  if(t.dataset.vi!=null){S.draft.hero.views[+t.dataset.vi][t.dataset.vf]=t.value;return pv()}
  if(t.dataset.si!=null){S.draft.sections[+t.dataset.si].show=t.checked;return pv()}
  const k=t.dataset.k;if(!k)return;
  let val=coerce(k,t);
  if(t.dataset.t==="color"){if(!/^#[0-9a-f]{6}$/i.test(val))return;$$(`[data-k="${k}"]`,form).forEach(x=>{if(x!==t)x.value=val})}
  if(t.dataset.t==="range"){const o=t.parentElement.querySelector("output");if(o)o.textContent=val}
  setP(S.draft,k,val);pv();
});

async function edLoad(){
  const r=await sb.from("site_config").select("id,data").in("id",["main","draft"]);if(r.error)throw r.error;
  const m=(r.data.find(x=>x.id==="main")||{}).data||{},d=(r.data.find(x=>x.id==="draft")||{}).data;
  S.live=normDraft(RAAS_merge(RAAS_DEFAULTS,cl(m)));S.hasDraft=!!d;
  S.draft=normDraft(RAAS_merge(RAAS_DEFAULTS,cl(d||m)));S.trash=new Set();S.info={};histReset();
}
/* ---- undo / redo ---- */
function histReset(){S.H=[JSON.stringify(S.draft)];S.hp=0}
function commit(){const j=JSON.stringify(S.draft);if(j===S.H[S.hp]){edStat();return}S.H=S.H.slice(0,S.hp+1);S.H.push(j);if(S.H.length>100)S.H.shift();S.hp=S.H.length-1;histBtns();edStat()}
let ct;const touch=()=>{pv();clearTimeout(ct);ct=setTimeout(commit,350);edStat(true)};
function histBtns(){const u=$("#undo"),r=$("#redo");if(u)u.disabled=S.hp<=0;if(r)r.disabled=S.hp>=S.H.length-1}
function jump(d){clearTimeout(ct);commit();const n=S.hp+d;if(n<0||n>=S.H.length)return;S.hp=n;S.draft=JSON.parse(S.H[n]);edDraw();pv();histBtns();edStat()}
ACT.undo=()=>jump(-1);ACT.redo=()=>jump(1);
function edStat(pending){const e=$("#edstat");if(!e)return;
  const dirty=pending||!sameJ(S.draft,S.live);
  e.innerHTML=dirty?`<b style="color:#b45309">● Changes not published yet</b>${S.hasDraft?" (a saved draft exists)":""}`:`<span style="color:#047857">● Live website matches this editor</span>`}

  if(kind==="textarea")return `<label class="f"><span>${esc(l)}</span><textarea rows="3" ${eK(k)} data-et="str">${esc(v)}</textarea></label>`;
  return `<label class="f"><span>${esc(l)}</span><input ${eK(k)} data-et="str" value="${esc(v)}"></label>`};
const eNum=(l,k,ph,step)=>`<label class="f"><span>${esc(l)}</span><input type="number" min="0" step="${step||1}" ${eK(k)} data-et="num" value="${esc(getP(S.draft,k)??"")}" placeholder="${esc(ph||"")}"></label>`;
const eSel=(l,k,opts)=>{const v=String(getP(S.draft,k)??"");return `<label class="f"><span>${esc(l)}</span><select ${eK(k)} data-et="str">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===v?"selected":""}>${esc(o[1])}</option>`).join("")}</select></label>`};
const eTog=(l,k)=>`<label class="tg"><input type="checkbox" ${eK(k)} data-et="toggle" ${getP(S.draft,k)?"checked":""}> ${esc(l)}</label>`;
const eRng=(l,k,min,max,step)=>{const v=getP(S.draft,k);return `<label class="f"><span>${esc(l)}</span><div class="cp"><input type="range" min="${min}" max="${max}" step="${step}" ${eK(k)} data-et="num" value="${v}"><output style="min-width:44px">${v}</output></div></label>`};
const eCol=(l,k,def,clr)=>{const keys=k.split("|"),v=getP(S.draft,keys[0])||"";

const eMed=(l,k,kind,folder)=>{const v=getP(S.draft,k)||"";

  <div class="f"><span>Lighter video for phones (optional)</span>${h.videoMobile?`<video src="${esc(h.videoMobile)}" muted controls playsinline style="height:80px;background:#000"></video>`:""}<div class="mrow"><label class="b o s">${h.videoMobile?"Replace":"Upload"}<input type="file" hidden accept="video/mp4,video/webm,.mp4,.webm" data-chg="wvup" data-k="hero.videoMobile"></label>${h.videoMobile?`<button class="b d s" data-act="emdel" data-k="hero.videoMobile">Delete</button>`:""}</div></div>
  <div class="acts" style="justify-content:flex-start"><button class="b o s" data-act="wreset">Reset playback settings</button></div>
  <p class="mut" style="font-size:12px;margin-top:8px">The preview on the right shows the uploaded video straight away, before it goes live. Use “Save draft” to keep it for later or “Publish” to put it on the live website.</p>`}
/* checks whether the wallet video really has a transparent background */
S.wInfo=S.wInfo||{};
function wStatHTML(u){const r=S.wInfo[u];
  if(!r){if(u&&window.RAAS_analyzeVideo){S.wInfo[u]={kind:"checking"};RAAS_analyzeVideo(u).then(x=>{S.wInfo[u]=x;const e=$("#wstat");if(e&&S.draft.hero.video===u)e.innerHTML=wStatHTML(u)})}return wMsg({kind:"checking"})}
  return wMsg(r)}
function wMsg(r){const M={
  checking:["#6b7280","Checking the video background…"],
  alpha:["#047857","✓ Real transparent video (alpha channel). Only the product is shown on the website. For iPhone / Safari also upload the HEVC copy below, or the background is removed automatically there."],
  solid:["#b45309",`This file has no transparency – it has a solid ${r.hex?`<span style="display:inline-block;width:11px;height:11px;border:1px solid #999;vertical-align:-1px;background:${r.hex}"></span> ${r.hex}`:""} background (normal for MP4). The website removes this background automatically and shows only the wallet. For the cleanest edges export a WebM with alpha.`],
  scene:["#b91c1c","This video has no transparency and its background is not one plain colour, so it cannot be removed cleanly. Please export the video with a transparent background (WebM VP9 with alpha) or on one plain colour."],
  blocked:["#b45309","The video could not be inspected here (storage blocked pixel access). It will still play."],
  error:["#b91c1c","This video could not be read by the browser."],unknown:["#6b7280","Could not check the video in time."]}[r.kind]||["#6b7280",""];
  return `<p style="font-size:12.5px;margin:6px 0;color:${M[0]}">${M[1]}</p>`}
ACT.wreset=()=>{S.draft.ext.wallet=cl(RAAS_EXT_DEFAULTS.wallet);syncType();edDraw();touch();commit()};
function syncType(){const h=S.draft.hero,w=S.draft.ext.wallet;h.mediaType=(w.enabled!==false&&(h.video||h.videoMobile))?"video":(h.image?"image":"3d")}
function probeVideo(file){return new Promise((res,rej)=>{const v=document.createElement("video"),u=URL.createObjectURL(file),msg="This video cannot be read by the browser. Please export it as H.264 MP4 or WebM.";
  const tm=setTimeout(()=>done(rej,new Error(msg)),12000),done=(f,x)=>{clearTimeout(tm);URL.revokeObjectURL(u);f(x)};
  v.preload="metadata";v.muted=true;v.onloadedmetadata=()=>done(res,{w:v.videoWidth,h:v.videoHeight,d:v.duration});v.onerror=()=>done(rej,new Error(msg));v.src=u})}
const trashOld=u=>{if(u&&String(u).includes("/storage/v1/object/public/media/"))S.trash.add(u)};
CHG.wvup=async t=>{
  const f=t.files[0];t.value="";if(!f)return;
  const isH=t.dataset.k==="ext.wallet.hevc";
  if(isH){if(!/\.(mov|mp4)$/i.test(f.name))throw new Error("The iPhone / Safari copy must be a .mov or .mp4 (HEVC with alpha).")}
  else if(!/\.(mp4|webm)$/i.test(f.name)||(f.type&&!/^video\/(mp4|webm)$/.test(f.type)))throw new Error("Only MP4 or WebM videos are allowed.");
  if(f.size>MAXVID)throw new Error("This video is "+(f.size/1048576).toFixed(1)+" MB. The limit is 50 MB. Please compress it.");
  if(f.size<1000)throw new Error("This file looks empty or damaged.");
  const k=t.dataset.k,btn=$("#wvbtn");toast("Checking video…");const m=isH?await probeVideo(f).catch(()=>({w:"?",h:"?",d:NaN})):await probeVideo(f);
  let info=null;if(!isH&&window.RAAS_analyzeVideo){const u=URL.createObjectURL(f);info=await RAAS_analyzeVideo(u);URL.revokeObjectURL(u)}
  toast("Uploading "+(f.size/1048576).toFixed(1)+" MB… please wait");if(btn)btn.style.opacity=.5;
  try{const url=await up(f,"hero-wallet");trashOld(getP(S.draft,k));setPE(S.draft,k,url);if(info)S.wInfo[url]=info;
    if(k==="hero.video")S.draft.ext.wallet.enabled=true;syncType();
    edDraw();touch();commit();toast(`Video ready (${m.w}×${m.h}${isFinite(m.d)?", "+m.d.toFixed(1)+"s":""}). Check the preview, then press Publish.`)}
  finally{if(btn)btn.style.opacity=1}
};
CHG.emup=async t=>{
  const f=t.files[0];t.value="";if(!f)return;
  if(t.dataset.kind==="image"){if(!/^image\//.test(f.type)&&!/\.(ico|svg)$/i.test(f.name))throw new Error("Please choose an image file.");if(f.size>MAXIMG)throw new Error("Image is larger than 8 MB.")}
  toast("Uploading…");const url=await up(f,t.dataset.folder||"branding"),k=t.dataset.k;trashOld(getP(S.draft,k));setPE(S.draft,k,url);
  if(k==="hero.image")syncType();edDraw();touch();commit();toast("Uploaded")};
ACT.emdel=a=>{const k=a.dataset.k;if(!confirm("Delete this file? It is removed from the website when you press Publish."))return;trashOld(getP(S.draft,k));setPE(S.draft,k,"");if(k.startsWith("hero."))syncType();edDraw();touch();commit()};

/* ---- one input handler for every editor field ---- */
function ecoerce(t){switch(t.dataset.et){case"toggle":return t.checked;case"num":return t.value===""?"":+t.value;case"list":return t.value.split("\n").map(x=>x.trim()).filter(Boolean);default:return t.value}}
document.addEventListener("input",e=>{
  const t=e.target,ed=t.closest&&t.closest("#ed");if(!ed||!t.dataset.ek)return;
  let v=ecoerce(t);const keys=t.dataset.ek.split("|");
  if(t.dataset.et==="color"){if(v!==""&&!/^#[0-9a-f]{6}$/i.test(v))return;$$(`[data-ek="${t.dataset.ek}"]`,ed).forEach(x=>{if(x!==t)x.value=v||(x.type==="color"?x.value:"")})}
  if(t.type==="range"){const o=t.parentElement.querySelector("output");if(o)o.textContent=v}
  keys.forEach(k=>setPE(S.draft,k,v));
  if(t.dataset.ek==="ext.wallet.enabled")syncType();
  if(t.dataset.ek.startsWith("look.")){const sw=ed.querySelector(".swatch");if(sw)[...sw.children].forEach((x,i)=>x.style.background=getP(S.draft,CF[i][1])||CF[i][2])}
  const pr=$("#wprev");if(pr){if(t.dataset.ek==="ext.wallet.speed")pr.playbackRate=+v||1;if(t.dataset.ek==="ext.wallet.loop")pr.loop=!!v}
  touch();
});
addEventListener("message",e=>{
  const f=$("#pv"),d=e.data;if(!f||!d||e.source!==f.contentWindow)return;
  if(d.raasSelect){S.sel=d.raasSelect;S.etab="text";edDraw();pvHi()}
  if(d.raasStyleInfo){const i=d.raasStyleInfo;S.info=S.info||{};S.info[i.id]=i;
    if(S.etab==="text"&&S.sel===i.id){const ed=$("#ed"),P="ext.styles."+i.id+".",q=s=>ed.querySelector(`[data-ek="${P}${s}"]`);
      const sz=q("size");if(sz&&!sz.value)sz.placeholder=Math.round(i.size);
      const lh=q("lh");if(lh&&!lh.value)lh.placeholder=i.lh==="normal"?"normal":(parseFloat(i.lh)/i.size).toFixed(2);
      const co=ed.querySelector(`input[type=color][data-ek="${P}color"]`);if(co&&!getP(S.draft,P+"color")&&toHex(i.color))co.value=toHex(i.color)}}
});
/* ---- save draft / publish / reset ---- */
function checkDraft(){const h=S.draft.hero;if(h.video&&!/^https?:\/\//i.test(h.video))throw new Error("The hero video link is not valid.");
  const sp=+S.draft.ext.wallet.speed;if(!(sp>=.1&&sp<=4))throw new Error("Playback speed must be between 0.1 and 4.");}
ACT.edsave=async a=>{clearTimeout(ct);commit();a.disabled=true;try{checkDraft();const r=await sb.from("site_config").upsert({id:"draft",data:S.draft,updated_at:new Date().toISOString()});if(r.error)throw r.error;S.hasDraft=true;toast("Draft saved. It is NOT live yet.")}finally{a.disabled=false}};
async function cleanTrash(){
  const now=JSON.stringify(S.draft),paths=[];
  S.trash.forEach(u=>{if(now.includes(u))return;const m=String(u).split("/storage/v1/object/public/media/")[1];if(m&&/^(hero-wallet|branding)\//.test(m))paths.push(decodeURIComponent(m.split("?")[0]))});
  if(paths.length){try{await sb.storage.from("media").remove(paths)}catch(e){console.warn("cleanup",e)}}
}
ACT.edpub=async a=>{clearTimeout(ct);commit();a.disabled=true;
  try{checkDraft();const r=await sb.from("site_config").upsert({id:"main",data:S.draft,updated_at:new Date().toISOString()});if(r.error)throw r.error;
    await sb.from("site_config").delete().eq("id","draft");await cleanTrash();
    S.live=cl(S.draft);S.hasDraft=false;S.trash=new Set();histReset();histBtns();edDraw();edStat();toast("Published. The live website is updated for every visitor.")}
  finally{a.disabled=false}};
ACT.edresetall=()=>{if(!confirm("Reset EVERYTHING in the editor (texts, fonts, colours, branding, hero video) to the original RAAS defaults?\n\nNothing changes on the live site until you press Publish. You can still Undo."))return;
  [S.draft.hero.video,S.draft.hero.videoMobile,S.draft.hero.image,S.draft.brand.logoUrl,S.draft.brand.footerLogoUrl,S.draft.ext.brand.favicon].forEach(trashOld);
  S.draft=normDraft(RAAS_merge(RAAS_DEFAULTS,{}));edDraw();touch();commit()};

/* ---- product discounts: live calculator ---- */
function finalPrice(price,type,val){if(price==null||val==null||val==="")return price;return type==="percent"?Math.round(price*(1-val/100)):Math.max(0,Math.round(price-val))}
function discCell(p){
  if(p.price==null)return '<span class="mut">not set</span>';if(p.discount_value==null)return money(p.price);
  const n=Date.now(),s=p.discount_start&&Date.parse(p.discount_start)>n?"scheduled":p.discount_end&&Date.parse(p.discount_end)<=n?"expired":"active";
  return `<s class="mut">${money(p.price)}</s> <b>${money(finalPrice(p.price,p.discount_type,p.discount_value))}</b><br><span class="tag">${p.discount_type==="percent"?p.discount_value+"% off":"PKR "+p.discount_value+" off"}</span> <span class="tag ${s==="active"?"delivered":s==="scheduled"?"pending":"cancelled"}">${s}</span>`}
function calcDisc(){
  const el=$("#pcalc");if(!el)return;const price=$("#pprice").value===""?null:+$("#pprice").value,en=$("#pden").checked,t=$("#pdt").value,v=$("#pdv").value===""?null:+$("#pdv").value;
  $("#pdbox").style.opacity=en?1:.5;
  if(!en||price==null||v==null){el.innerHTML=price==null?"Enter the original price to see the final price.":en?"Enter the discount value.":"Discount is off. Customers pay the original price.";return}
  const f=finalPrice(price,t,v);el.innerHTML=`Original <s>${money(price)}</s> → discount ${t==="percent"?v+"%":money(v)} → <b>Final price ${money(f)}</b> <span class="mut">(customers save ${money(price-f)})</span>`}
$("#mbox").addEventListener("input",e=>{if(["pprice","pden","pdt","pdv","pds","pde"].includes(e.target.id))calcDisc()});
ACT.rmdisc=()=>{$("#pden").checked=false;$("#pdv").value="";$("#pds").value="";$("#pde").value="";calcDisc();toast("Discount cleared. Press Save product to apply.")};
ACT.rmdiscrow=async a=>{if(!confirm("Remove the discount from this product?"))return;const r=await sb.from("products").update({discount_type:null,discount_value:null,discount_start:null,discount_end:null}).eq("id",a.dataset.id);if(r.error)throw r.error;toast("Discount removed");V.products()};
