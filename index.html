<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAAS — Premium Wallets</title>
<meta name="description" content="RAAS — premium wallets and everyday accessories. Carry your identity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Admin "Website Customization" will override these from the database */
  --primary:#000; --secondary:#fff; --bg:#fff; --text:#0a0a0a; --btn:#000; --btn-text:#fff;
  --header:#fff; --footer:#000; --accent:#000; --muted:#6b6b6b; --line:#e6e6e6; --soft:#f4f4f4;
  --radius:0px; --space:clamp(64px,9vw,120px);
  --head:'Cormorant Garamond',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--head);font-weight:500;line-height:1.05}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--btn);color:var(--btn-text);padding:17px 36px;letter-spacing:.16em;font-size:12px;font-weight:600;border:1px solid var(--btn);border-radius:var(--radius);position:relative;overflow:hidden;transition:color .4s var(--ease),transform .25s var(--ease),box-shadow .4s;box-shadow:0 10px 28px -14px rgba(0,0,0,.6)}
.btn:hover{box-shadow:0 20px 40px -14px rgba(0,0,0,.6)}
.btn:active{transform:scale(.96)!important}
.btn::before{content:"";position:absolute;inset:0;background:var(--btn-text);transform:translateY(101%);transition:transform .45s var(--ease)}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 4.5s 1.5s infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.btn span{position:relative;z-index:1;display:inline-flex;align-items:center;gap:12px}
.btn span::after{content:"";width:14px;height:1px;background:currentColor;transition:width .4s var(--ease)}
.btn:hover span::after{width:30px}
.btn:hover::before{transform:none}.btn:hover{color:var(--btn)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--text)}
.btn.ghost::before{background:var(--btn)}.btn.ghost:hover{color:var(--btn-text)}

/* announcement marquee */
.announce{background:var(--primary);color:var(--secondary);font-size:12px;letter-spacing:.12em;overflow:hidden;white-space:nowrap;padding:9px 0}
.track{display:inline-flex;gap:56px;animation:slide 28s linear infinite;padding-left:56px}
.announce:hover .track,.ticker:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--header);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.stuck{border-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{font-family:var(--head);font-size:30px;letter-spacing:.32em;font-weight:600}
.logo img{height:28px;width:auto}
nav{display:flex;gap:34px}
nav a,.ico{font-size:12px;letter-spacing:.14em;font-weight:500;position:relative}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
nav a:hover::after{transform:scaleX(1);transform-origin:left}
.tools{display:flex;gap:20px;align-items:center}
.cartbtn b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--btn);color:var(--btn-text);font-size:10px;margin-left:6px}
.cartbtn b.pop{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.6)}}
.menu{display:none}
.search{display:none;border-top:1px solid var(--line);padding:12px 0}
.search.on{display:block}
.search input{width:100%;border:0;border-bottom:1px solid var(--text);padding:10px 0;font:inherit;background:transparent;outline:0}

/* hero */
.hero{position:relative;min-height:min(86vh,760px);background:var(--primary);color:var(--secondary);overflow:hidden;display:grid;align-items:center}
.hero .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(46px,8vw,118px);letter-spacing:-.01em}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.hero h1 .w i{display:inline-block;font-style:normal;transform:translateY(105%);animation:up 1s var(--ease) forwards}
@keyframes up{to{transform:none}}
.hero p{max-width:420px;margin:26px 0 38px;color:#cfcfcf;opacity:0;animation:fade 1s .9s forwards}
.hero .btn{background:var(--secondary);color:var(--primary);border-color:var(--secondary);opacity:0;animation:fade 1s 1.15s forwards}
.hero .btn::before{background:var(--primary)}.hero .btn:hover{color:var(--secondary)}
@keyframes fade{to{opacity:1}}
.stage{position:relative;aspect-ratio:1;perspective:1000px;display:grid;place-items:center}
.stage .card3d{width:260px;height:170px;transform-style:preserve-3d;animation:spin 14s ease-in-out infinite;will-change:transform}
@keyframes spin{0%,100%{transform:rotateY(-28deg) rotateX(8deg)}50%{transform:rotateY(28deg) rotateX(-4deg) translateY(-14px)}}
.ring{position:absolute;inset:6%;border:1px solid rgba(255,255,255,.18);border-radius:50%;animation:rot 40s linear infinite}
.ring::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#fff}
.ring.r2{inset:18%;animation-direction:reverse;animation-duration:26s;border-color:rgba(255,255,255,.1)}
@keyframes rot{to{transform:rotate(360deg)}}
.hero .scroll{position:absolute;left:50%;bottom:22px;width:1px;height:46px;background:rgba(255,255,255,.3);overflow:hidden}
.hero .scroll::after{content:"";position:absolute;inset:0;background:#fff;animation:drip 2s ease-in-out infinite}
@keyframes drip{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}

/* ticker */
.ticker{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:20px 0;font-family:var(--head);font-size:clamp(28px,4vw,48px)}
.ticker .track{animation-duration:36s;gap:48px}
.ticker em{font-style:italic;color:var(--muted)}

/* reveal (one scroll mechanism, used for section headings + cards) */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* collection */
section{padding:var(--space) 0}
.head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:20px;margin-bottom:36px}
.head h2{font-size:clamp(36px,5vw,64px)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{padding:9px 18px;border:1px solid var(--line);font-size:12px;letter-spacing:.1em;border-radius:var(--radius);transition:.3s}
.chip.on,.chip:hover{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
select{padding:9px 14px;border:1px solid var(--line);font:inherit;font-size:13px;background:var(--bg);color:var(--text);border-radius:var(--radius)}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.pc{cursor:pointer;display:block;text-align:left;width:100%}
.pc .img{position:relative;aspect-ratio:4/5;background:var(--soft);overflow:hidden;border-radius:var(--radius)}
.pc .img>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s,transform .9s var(--ease)}
.pc .img .b{opacity:0}
.pc:hover .img .b{opacity:1}.pc:hover .img .a{transform:scale(1.06)}
.tag{position:absolute;left:12px;top:12px;z-index:2;background:var(--primary);color:var(--secondary);font-size:10px;letter-spacing:.12em;padding:5px 9px}
.hint{position:absolute;right:12px;bottom:12px;z-index:2;background:rgba(255,255,255,.92);color:#000;font-size:10px;letter-spacing:.1em;padding:5px 9px;transform:translateY(8px);opacity:0;transition:.4s var(--ease)}
.pc:hover .hint{transform:none;opacity:1}
.pc h3{font-family:var(--body);font-size:14px;font-weight:500;margin-top:14px}
.pc .cat{font-size:12px;color:var(--muted)}
.pc .pr{font-size:14px;margin-top:4px;font-weight:500}
.dots{display:flex;gap:6px;margin-top:10px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}

/* product page overlay */
.pdp{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .7s var(--ease),visibility .7s}
.pdp.open{transform:none;visibility:visible}
.pdp .top{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,72px);padding:32px 0 var(--space)}
.gal{display:grid;grid-template-columns:76px 1fr;gap:14px;align-self:start;position:sticky;top:84px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs button{aspect-ratio:1;background:var(--soft);border:1px solid transparent;overflow:hidden;opacity:.6;transition:.3s}
.thumbs button.on{border-color:var(--text);opacity:1}
.thumbs svg,.thumbs img{width:100%;height:100%;object-fit:cover}
.view{position:relative;aspect-ratio:1;background:var(--soft);overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab;border-radius:var(--radius)}
.view.drag{cursor:grabbing}
.view .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:transform .15s,opacity .45s}
.view.zoom{cursor:zoom-out}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.pill{background:rgba(255,255,255,.94);color:#000;font-size:11px;letter-spacing:.08em;padding:8px 13px;border-radius:99px}
.pill.on{background:#000;color:#fff}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--text);z-index:2;transition:width .1s}
.swipe{position:absolute;left:50%;top:46%;z-index:2;transform:translate(-50%,-50%);pointer-events:none;animation:nudge 2.2s 1s 2 both;opacity:0}
@keyframes nudge{0%{opacity:0;transform:translate(-90%,-50%)}30%{opacity:1}70%{opacity:1;transform:translate(-10%,-50%)}100%{opacity:0;transform:translate(-10%,-50%)}}
.info h1{font-size:clamp(34px,4vw,54px)}
.info .price{font-size:22px;margin:14px 0 4px}
.info .price s{color:var(--muted);font-size:16px;margin-left:8px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--text)}
.badge.out::before{background:transparent;border:1px solid var(--muted)}
.lbl{font-size:12px;letter-spacing:.1em;margin:30px 0 12px;font-weight:600}
.lbl span{font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);position:relative;transition:transform .3s var(--ease)}
.sw button:hover{transform:scale(1.12)}
.sw button.on::after{content:"";position:absolute;inset:-5px;border:1px solid var(--text);border-radius:50%;animation:ringin .4s var(--ease)}
@keyframes ringin{from{transform:scale(.7);opacity:0}}
.sw button.na{opacity:.35}
.sw button.na::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);transform:rotate(45deg)}
.qrow{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.qty{display:inline-flex;border:1px solid var(--line);align-items:center}
.qty button{width:44px;height:50px;font-size:18px}.qty output{min-width:34px;text-align:center}
.acts{display:grid;gap:10px;margin-top:12px}
.spec{margin-top:34px;border-top:1px solid var(--line)}
.spec details{border-bottom:1px solid var(--line);padding:16px 0}
.spec summary{cursor:pointer;font-size:13px;letter-spacing:.08em;font-weight:500;list-style:none;display:flex;justify-content:space-between}
.spec summary::after{content:"+";transition:transform .3s}
.spec details[open] summary::after{transform:rotate(45deg)}
.spec p{margin-top:10px;color:var(--muted)}

/* about */
.about{background:var(--soft)}
.about .in{max-width:760px}
.about h2{font-size:clamp(34px,5vw,60px);margin-bottom:24px}
.about p{font-family:var(--head);font-size:clamp(22px,2.6vw,32px);line-height:1.35}
.about p .ln{display:block;overflow:hidden}
.contact{display:flex;gap:40px;flex-wrap:wrap;color:var(--muted)}

footer{background:var(--footer);color:#fff;padding:64px 0 28px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:32px}
footer h4{font-size:12px;letter-spacing:.14em;margin-bottom:14px;font-weight:600}
footer li{list-style:none;margin:8px 0;color:#bbb;font-size:14px}
footer li a:hover{color:#fff}
.copy{border-top:1px solid #222;margin-top:44px;padding-top:20px;font-size:12px;color:#777}

/* cart drawer */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;visibility:hidden;transition:.4s}
.shade.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:95;transform:translateX(100%);transition:transform .6s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow:auto;padding:20px 24px}
.drawer .df{border-top:1px solid var(--line);padding:20px 24px}
.ci{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);animation:fade .5s forwards;opacity:0}
.ci .t{width:76px;height:92px;background:var(--soft);overflow:hidden}
.ci .t svg,.ci .t img{width:100%;height:100%;object-fit:cover}
.ci small{color:var(--muted);display:block}
.ci .rm{font-size:12px;text-decoration:underline;color:var(--muted)}
.row{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}
.row.tot{font-weight:600;font-size:16px;border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.form{display:grid;gap:10px;margin-top:14px}
.form input,.form textarea{width:100%;padding:13px;border:1px solid var(--line);font:inherit;background:var(--bg);color:var(--text);border-radius:var(--radius)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.cur{position:fixed;width:34px;height:34px;border:1px solid var(--text);border-radius:50%;pointer-events:none;z-index:200;mix-blend-mode:difference;border-color:#fff;transform:translate(-50%,-50%);transition:width .3s,height .3s,background .3s;display:none}
.cur.big{width:70px;height:70px;background:#fff}
@media (hover:hover) and (pointer:fine){.cur{display:block}}

/* realistic CSS-3D wallet: leather faces, stitching, sheen, cards sliding out */
.stage .wl{scale:1.45}
.wl{position:relative;width:260px;height:170px;transform-style:preserve-3d}
.wf{position:absolute;display:block;backface-visibility:hidden;background:linear-gradient(135deg,#454545,#1a1a1a 55%,#303030)}
.wf.fr,.wf.bk{inset:0;border-radius:12px}
.wf.fr{transform:translateZ(17px)}
.wf.bk{transform:rotateY(180deg) translateZ(17px)}
.wf.sl,.wf.sr{width:34px;height:170px;left:113px;background:linear-gradient(90deg,#0d0d0d,#2a2a2a)}
.wf.sl{transform:rotateY(-90deg) translateZ(130px)}
.wf.sr{transform:rotateY(90deg) translateZ(130px)}
.wf.sb{width:260px;height:34px;top:68px;background:#0b0b0b;transform:rotateX(-90deg) translateZ(85px)}
.wf.fr::before{content:"";position:absolute;inset:11px;border:1px dashed rgba(255,255,255,.3);border-radius:8px}
.wf.fr::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{background-position:150% 0}100%{background-position:-50% 0}}
.wf.fr b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-weight:600;letter-spacing:.35em;text-indent:.35em;font-size:28px;color:#cfcfcf;text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.18)}
.kd{position:absolute;left:22px;top:24px;width:216px;height:130px;border-radius:10px;background:linear-gradient(135deg,#fafafa,#c8c8c8);transform:translateZ(var(--z));animation:pk 6s ease-in-out infinite}
.kd::before{content:"";position:absolute;left:16px;top:16px;width:28px;height:21px;border-radius:4px;background:rgba(0,0,0,.22)}
.kd.k1{--z:-6px}.kd.k2{--z:2px;left:34px;background:linear-gradient(135deg,#8c8c8c,#4e4e4e);animation-delay:.45s}.kd.k3{--z:9px;left:12px;background:linear-gradient(135deg,#d8d8d8,#9a9a9a);animation-delay:.9s}
@keyframes pk{0%,12%{transform:translateZ(var(--z)) translateY(0)}34%,62%{transform:translateZ(var(--z)) translateY(-78px)}84%,100%{transform:translateZ(var(--z)) translateY(0)}}

/* ---- cinematic hero: rings that draw in, ticks, orbiting comet, pointer depth ---- */
.hero .wrap.grid{transform:translate3d(0,calc(var(--sy,0)*.16px),0);opacity:calc(1 - var(--sy,0)/1000)}
body:not(.ready) .hero *,body:not(.ready) .stage{animation-play-state:paused}
.stage{--px:0;--py:0}
.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:translate3d(calc(var(--px)*-16px),calc(var(--py)*-12px),0);transition:transform .7s var(--ease)}
.rc{fill:none;stroke:#fff}
.c1{stroke-opacity:.55;stroke-width:1;stroke-dasharray:1;animation:draw 2.4s .5s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}}
.c2{stroke-opacity:.3;stroke-width:7;stroke-dasharray:.22 .78}
.c3{stroke-opacity:.16;stroke-width:1;stroke-dasharray:.6 .4}
.spin{transform-box:view-box;transform-origin:50% 50%;animation:rot 40s linear infinite}
.spin.slow{animation-duration:120s}.spin.rev{animation-direction:reverse;animation-duration:70s}.spin.orbit{animation-duration:14s}
.rip{opacity:0;transform-box:view-box;transform-origin:50% 50%;stroke-width:1.5}
.ping .rip{animation:ripple 1.5s var(--ease)}
@keyframes ripple{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.1)}}
.lite{position:absolute;inset:6%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at calc(50% + var(--px)*70%) calc(50% + var(--py)*70%),rgba(255,255,255,.14),transparent 46%);transition:background .3s}
.media{position:absolute;inset:15%;perspective:1100px;transform:translate3d(calc(var(--px)*26px),calc(var(--py)*20px),0) rotateY(calc(var(--px)*12deg)) rotateX(calc(var(--py)*-9deg));transition:transform .6s var(--ease)}
.media::after{content:"";position:absolute;left:16%;right:16%;bottom:-6%;height:8%;background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent);filter:blur(6px);animation:fsh 7s ease-in-out infinite}
@keyframes fsh{50%{transform:scale(.85);opacity:.6}}
.mv{position:absolute;inset:0}
.mv.first{animation:mfirst 1.7s .9s var(--ease) both}
@keyframes mfirst{from{opacity:0;transform:translateY(70px) scale(.8) rotateX(16deg);filter:blur(14px)}}
.mv.in{animation:vin 1.1s var(--ease) both}
@keyframes vin{from{opacity:0;transform:rotateY(58deg) scale(.88);filter:blur(10px)}}
.mv.out{animation:vout .9s var(--ease) both;pointer-events:none}
@keyframes vout{to{opacity:0;transform:rotateY(-58deg) scale(.88);filter:blur(10px)}}
.fl{width:100%;height:100%;display:grid;place-items:center;perspective:1100px;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotateZ(.5deg)}}
.mv img,.mv video{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 28px 36px rgba(0,0,0,.65))}
.vdots{position:absolute;left:0;right:0;bottom:-2%;display:flex;justify-content:center;gap:8px;z-index:3}
.vdots button{font-size:10px;letter-spacing:.12em;color:#aaa;padding:6px 12px;border:1px solid rgba(255,255,255,.25);border-radius:99px;transition:.3s}
.vdots button.on{background:#fff;color:#000;border-color:#fff}
.loader{position:fixed;inset:0;z-index:300;background:#000;color:#fff;display:grid;place-items:center;clip-path:inset(0);transition:clip-path 1.1s var(--ease)}
.loader span{font-family:var(--head);font-size:clamp(34px,8vw,72px);letter-spacing:.4em;text-indent:.4em;animation:lw 1.1s var(--ease) both}
@keyframes lw{from{letter-spacing:.9em;opacity:0}}
.loader.go{clip-path:inset(0 0 100% 0)}.loader.gone{display:none}
/* masked headings, card image reveal, product page entrance */
.head h2,.about h2{overflow:hidden;padding-bottom:.12em}
.mk{display:block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.in .mk{transform:none}
.pc .img{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease)}
.pc.in .img{clip-path:inset(0)}
.pc .img .a{transform:scale(1.18)}
.pc.in .img .a{transform:scale(1)}
.pc.in:hover .img .a{transform:scale(1.06)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
#pbody.first .gal{animation:rise .9s .15s var(--ease) both}
#pbody.first .info>*{animation:rise .9s var(--ease) both;animation-delay:calc(.25s + var(--i,0)*.07s)}
@media(prefers-reduced-motion:reduce){.loader{display:none}.hero .wrap.grid{transform:none;opacity:1}}

/* configuration-driven overrides */
[hidden]{display:none!important}
body{font-size:var(--bs,15px)}
.hero h1{font-size:calc(clamp(46px,8vw,118px)*var(--hs,1))}
.head h2{font-size:calc(clamp(36px,5vw,64px)*var(--hs,1))}
.about h2{font-size:calc(clamp(34px,5vw,60px)*var(--hs,1))}
.info h1{font-size:calc(clamp(34px,4vw,54px)*var(--hs,1))}
.announce .track{animation-duration:calc(28s*var(--k,1))}
.ticker .track{animation-duration:calc(36s*var(--k,1))}
.fl{animation-duration:calc(7s*var(--k,1))}
.mv.first{animation-duration:calc(1.7s*var(--k,1))}
.rv{transition-duration:calc(.9s*var(--k,1))}.mk{transition-duration:calc(1.1s*var(--k,1))}
.no-reveal .rv{opacity:1!important;transform:none!important}
.no-mask .mk{transform:none}
.no-cardReveal .pc .img{clip-path:none}.no-cardReveal .pc .img .a{transform:none}
.no-cursor .cur{display:none!important}
.no-shine .btn::after{display:none}
.no-float .fl,.no-float .media::after{animation:none}
.no-parallax .media{transform:none!important}
.no-parallax .hero .wrap.grid{transform:none!important;opacity:1!important}
.no-glow .lite{display:none}
.no-ticker .announce .track,.no-ticker .ticker .track{animation:none}
.no-loader .loader{display:none}

/* sale strip + countdown + discount badges */
.sale{display:none;background:var(--soft);border-bottom:1px solid var(--line)}
.sale.on{display:block}
.sale .wrap{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;padding-block:20px}
.sale h3{font-size:clamp(22px,3vw,34px)}
.cdn{display:flex;gap:8px}
.cdn div{background:var(--primary);color:var(--secondary);min-width:54px;padding:8px 6px;text-align:center;border-radius:var(--radius);overflow:hidden}
.cdn b{display:block;font-family:var(--head);font-size:24px;line-height:1.1}
.cdn b.flip{animation:flip .5s var(--ease)}
@keyframes flip{from{transform:translateY(-70%);opacity:0}}
.cdn small{font-size:9px;letter-spacing:.12em;opacity:.7}
.pr s,.price s{color:var(--muted);font-size:.85em;margin-left:8px;font-weight:400}
.off{display:inline-block;background:var(--primary);color:var(--secondary);font-size:11px;letter-spacing:.1em;padding:4px 9px;margin-left:10px;vertical-align:middle;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}70%,100%{box-shadow:0 0 0 10px transparent}}
.tag.sl{left:auto;right:12px;background:#fff;color:#000}
.pcd{margin-top:14px}.pcd small{display:block;color:var(--muted);margin-bottom:6px}
@media(max-width:900px){.stage .wl{scale:.95}.sale .wrap{gap:14px}}

@media(max-width:900px){
  nav{display:none}.menu{display:inline}
  nav.open{display:flex;position:absolute;top:72px;left:0;right:0;background:var(--header);flex-direction:column;padding:20px;gap:18px;border-bottom:1px solid var(--line)}
  .hero .grid{grid-template-columns:1fr}.stage{max-width:380px;margin:0 auto}
  .products{grid-template-columns:repeat(2,1fr);gap:22px 12px}
  .pgrid{grid-template-columns:1fr}.gal{position:static;grid-template-columns:1fr}
  .thumbs{flex-direction:row;order:2}.thumbs button{width:64px}
  .fg{grid-template-columns:1fr 1fr}
}
@media(min-width:1200px){.products.g3{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hero h1 .w i,.hero p,.hero .btn{opacity:1;transform:none}}

/* ===== section colours, text sizes, extra motion layers, banner (admin-controlled) ===== */
header{color:var(--head-text,inherit)}
.announce{background:var(--ann-bg,#000);color:var(--ann-text,#fff);font-size:calc(12px*var(--z-ann,1))}
.hero{background:var(--hero-bg,#000);color:var(--hero-text,#fff);isolation:isolate}
.hero p{color:inherit;opacity:.78;font-size:calc(var(--bs,15px)*var(--z-herod,1))}
.hero .wrap.grid{position:relative;z-index:2}
.hero h1{font-size:calc(clamp(46px,8vw,118px)*var(--hs,1)*var(--z-hero,1))}
.ticker{background:var(--tick-bg,#fff);color:var(--tick-text,#0a0a0a);font-size:calc(clamp(28px,4vw,48px)*var(--z-tick,1))}

.sale{background:var(--sale-bg,#f4f4f4);color:var(--sale-text,#0a0a0a)}
#wallets{background:var(--shop-bg,#fff);color:var(--shop-text,#0a0a0a)}
.about{background:var(--about-bg,#f4f4f4);color:var(--about-text,#0a0a0a)}
.pdp{background:var(--pdp-bg,#fff)}
footer{color:var(--foot-text,#fff)}
footer li,.fg p{color:inherit;opacity:.7;font-size:calc(14px*var(--z-foot,1))}
footer h4{font-size:calc(12px*var(--z-foot,1))}
.head h2{font-size:calc(clamp(36px,5vw,64px)*var(--hs,1)*var(--z-sec,1))}
.about h2{font-size:calc(clamp(34px,5vw,60px)*var(--hs,1)*var(--z-sec,1))}
.about p{font-size:calc(clamp(22px,2.6vw,32px)*var(--z-about,1))}
nav a,.ico{font-size:calc(12px*var(--z-nav,1))}
.btn{font-size:calc(12px*var(--z-btn,1))}
.pc h3{font-size:calc(14px*var(--z-card,1))}
.pc .pr{font-size:calc(14px*var(--z-price,1))}
.info h1{font-size:calc(clamp(34px,4vw,54px)*var(--hs,1)*var(--z-pdp,1))}
.info .price{font-size:calc(22px*var(--z-pdpp,1))}
.hlayers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:var(--bgo,.4);z-index:0}
.hl{position:absolute;translate:-50% -50%}
.hl.back{z-index:1}.hl.front{z-index:3}
.hl img,.hl video{width:100%;height:auto;display:block}
.an-float{animation:hfloat calc(6s*var(--k,1)) ease-in-out infinite}
.an-spin{animation:hspin calc(24s*var(--k,1)) linear infinite}
.an-pulse{animation:hpulse calc(4s*var(--k,1)) ease-in-out infinite}
.an-drift{animation:hdrift calc(9s*var(--k,1)) ease-in-out infinite}
@keyframes hfloat{50%{transform:translateY(-18px)}}
@keyframes hspin{to{transform:rotate(360deg)}}
@keyframes hpulse{50%{transform:scale(1.08)}}
@keyframes hdrift{50%{transform:translateX(26px)}}
section.banner{position:relative;height:var(--bh,60vh);min-height:240px;padding:0;overflow:hidden;background:#000;display:grid;place-items:center;text-align:center}
.bmedia{position:absolute;inset:0}.bmedia>*{width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--bo,.4)}
.btxt{position:relative;z-index:2;max-width:760px;padding:0 20px}
.btxt h2{font-size:calc(clamp(34px,6vw,80px)*var(--hs,1))}
.btxt p{margin:14px 0 24px;font-size:calc(var(--bs,15px)*1.1)}
.btxt .btn{background:#fff;color:#000;border-color:#fff}.btxt .btn::before{background:#000}.btxt .btn:hover{color:#fff}
</style>

<body>
<div class="cur" id="cur"></div>
<div class="loader" id="loader" aria-hidden="true"><span></span></div>

<div class="announce"><div class="track" id="ann"></div></div>

<header id="hdr">
  <div class="wrap bar">
    <button class="menu ico" id="menu" aria-label="Menu" data-t="menu">MENU</button>
    <a href="#top" class="logo" id="logo">RAAS</a>
    <nav id="nav">
      <a href="#top" data-t="navHome">HOME</a><a href="#wallets" data-t="navWallets">ALL WALLETS</a><a href="#about" data-t="navAbout">ABOUT US</a><a href="#contact" data-t="navContact">CONTACT</a>

      <button class="ico" id="sbtn" data-t="search">SEARCH</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/config.js"></script>
<script>
/* DATA LAYER: settings come from Supabase table site_config (merged over RAAS_DEFAULTS),
   products and categories from their tables. Without Supabase keys the page still runs with defaults. */
const D=window.RAAS_DEFAULTS, sbc=window.RAAS_SUPABASE||{};
const sb=(sbc.url&&sbc.anonKey&&window.supabase)?window.supabase.createClient(sbc.url,sbc.anonKey):null;
let CFG=window.RAAS_merge(D,{}),HERO_MEDIA={},SETTINGS={},PRODUCTS=[],CATS=[];
const T=k=>CFG.text[k]??k;
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl=u=>/^(https?:|mailto:|tel:|#|\/|\.)/i.test(u||"")?u:"#";
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
function buildSettings(){
  const h=CFG.hero,c=CFG.contact,s=CFG.sale;
  HERO_MEDIA={type:h.mediaType,image:h.image,imageMobile:h.imageMobile,video:h.video,videoMobile:h.videoMobile,poster:h.poster,views:h.views||[],interval:h.viewInterval};
  SETTINGS={announcements:CFG.announcement.enabled?CFG.announcement.items:[],
    hero:{title:h.title,desc:h.desc,btn:h.btnText,link:h.btnLink,image:""},
    about:CFG.about.text,contact:c,
    sale:s.enabled&&num(s.percent)?{label:s.label,percent:+s.percent,endsAt:s.endsAt||null}:null,
    delivery:{charge:num(CFG.delivery.charge),freeAbove:num(CFG.delivery.freeAbove)},
    categories:[{id:"all",name:T("collectionTitle")},...CATS.map(x=>({id:x.slug,name:esc(x.name)}))],
    policies:CFG.policies};
}
const mapProduct=p=>{
  let cols=(p.product_colours||[]).sort((a,b)=>a.sort-b.sort).map(c=>({id:c.id,name:esc(c.name),hex:/^#[0-9a-f]{3,8}$/i.test(c.hex)?c.hex:"#141414",inStock:c.stock>0,images:c.images||[]}));
  if(!cols.length)cols=[{id:null,name:"Default",hex:"#141414",inStock:false,images:[]}];
  return {id:p.id,name:esc(p.name),category:p.categories?p.categories.slug:"",description:esc(p.description),price:num(p.price),featured:p.featured,video:p.video_url,
    specs:(p.specs||[]).map(x=>({k:esc(x.k),v:esc(x.v)})),
    discount:p.discount_value!=null?{type:p.discount_type,value:+p.discount_value,startsAt:p.discount_start,endsAt:p.discount_end}:null,colours:cols};
};
async function loadData(){
  if(!sb)return;
  try{
    const [c,cats,pr]=await Promise.all([
      sb.from("site_config").select("data").eq("id","main").maybeSingle(),
      sb.from("categories").select("*").eq("active",true).order("sort"),
      sb.from("products").select("*, product_colours(*), categories(slug)").eq("active",true).order("sort")]);
    if(c.data&&c.data.data)CFG=window.RAAS_merge(D,c.data.data);
    CATS=cats.data||[]; PRODUCTS=(pr.data||[]).map(mapProduct);
  }catch(e){console.warn("RAAS: could not load store data",e)}
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>n==null?T("priceTbd"):"PKR "+Number(n).toLocaleString("en-PK");
/* Discounts: product discount (percent or fixed, optional start/end) wins over the store-wide sale. */
function disc(p){
  const now=Date.now(),d=p.discount,s=SETTINGS.sale;
  if(d&&(!d.startsAt||Date.parse(d.startsAt)<=now)&&(!d.endsAt||Date.parse(d.endsAt)>now))return d.type==="fixed"?{pct:0,fix:d.value,end:d.endsAt}:{pct:d.value,fix:0,end:d.endsAt};
  if(s&&s.percent&&(!s.endsAt||Date.parse(s.endsAt)>now))return {pct:s.percent,fix:0,end:s.endsAt};
  return {pct:0,fix:0,end:null};
}
const eff=p=>{if(p.price==null)return null;if(p.salePrice!=null)return p.salePrice;const d=disc(p);return Math.max(0,Math.round(p.price*(1-d.pct/100)-d.fix))};
const off=p=>{const d=disc(p);if(p.price==null)return d.pct?T("pctOff").replace("{n}",d.pct):"";const e=eff(p);return e<p.price?(d.pct?T("pctOff").replace("{n}",d.pct):T("saveAmt").replace("{n}",p.price-e)):""};
const priceHTML=p=>{const e=eff(p);return p.price!=null&&e<p.price?`${money(e)}<s>${money(p.price)}</s>`:money(p.price)};
const cdnHTML=end=>`<div class="cdn" data-end="${end}">${[T("days"),T("hours"),T("min"),T("sec")].map(x=>`<div><b>00</b><small>${x}</small></div>`).join("")}</div>`;
function tick(){
  $$(".cdn").forEach(c=>{
    const t=Math.max(0,Date.parse(c.dataset.end)-Date.now())/1000|0,v=[t/86400|0,t%86400/3600|0,t%3600/60|0,t%60];
    c.querySelectorAll("b").forEach((b,i)=>{const s=String(v[i]).padStart(2,"0");if(b.textContent!==s){b.textContent=s;b.classList.remove("flip");void b.offsetWidth;b.classList.add("flip")}});
  });
}
function drawSale(){
  const s=SETTINGS.sale,el=$("#sale");
  if(!s||!s.percent||(s.endsAt&&Date.parse(s.endsAt)<=Date.now())){el.classList.remove("on");el.innerHTML="";return}
  el.classList.add("on");
  el.innerHTML=`<div class="wrap"><h3>${esc(s.label)}: ${esc(T("saleLine")).replace("{n}",s.percent)}</h3>${s.endsAt?cdnHTML(s.endsAt):""}<a class="btn" href="#wallets"><span>${T("shopSale")}</span></a></div>`;
  tick();
}
setInterval(tick,1000);
const hero3d=()=>`<div class="wl"><i class="wf bk"></i><i class="wf sl"></i><i class="wf sr"></i><i class="wf sb"></i><i class="kd k1"></i><i class="kd k2"></i><i class="kd k3"></i><i class="wf fr"><b>${esc(CFG.hero.sampleText)}</b></i></div>`;

/* Placeholder wallet drawing; `a` is the viewing angle in degrees so the
   4 placeholder photos (and the spin viewer) really look like turning the wallet. */
function wallet(a,hex,bg){
  const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r),w=Math.max(Math.abs(c)*230,6),side=Math.abs(s)*34,
        back=c<0,face=back?shade(hex,-18):hex,x=-w/2-(s>0?side/2:-side/2);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="${bg||'#efefef'}"/>
  <ellipse cx="200" cy="318" rx="${70+w/3}" ry="12" fill="#000" opacity=".12"/>
  <g transform="translate(200 190)">
   <rect x="${x+(s>0?w:-side)}" y="-96" width="${side}" height="192" rx="6" fill="${shade(hex,-35)}"/>
   <rect x="${x}" y="-100" width="${w}" height="200" rx="10" fill="${face}"/>
   ${w>60?`<rect x="${x+w*.07}" y="-88" width="${w*.86}" height="176" rx="6" fill="none" stroke="#fff" stroke-opacity=".28" stroke-dasharray="4 4"/>
   ${back?'':`<text x="${x+w/2}" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="${Math.max(10,w*.12)}" letter-spacing="${w*.04}" fill="#fff" fill-opacity=".85">${esc(CFG.hero.sampleText)}</text>`}`:''}
  </g></svg>`}
function shade(h,p){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+p*2.55|0));return "#"+((1<<24)+(f(n>>16)<<16)+(f(n>>8&255)<<8)+f(n&255)).toString(16).slice(1)}
const ANGLES=[0,32,-32,70];                       // the 3–4 "photo" angles
const frameHTML=(img,i,hex)=>img?`<img src="${img}" alt="" loading="lazy">`:wallet(ANGLES[i%4],hex);
function frames(col){return col.images&&col.images.length?col.images:ANGLES.map(()=>null)}

/* ---------- apply settings ---------- */
function applySettings(){
  const h=SETTINGS.hero;
  $("#hTitle").innerHTML=h.title.split(" ").map((w,i)=>`<span class="w"><i style="animation-delay:${.15+i*.14}s">${esc(w)}</i></span>`).join(" ");
  $("#hDesc").textContent=h.desc; $("#hBtn span").textContent=h.btn; $("#hBtn").href=safeUrl(h.link);
  buildMedia();
  const a=[...SETTINGS.announcements,...SETTINGS.announcements,...SETTINGS.announcements,...SETTINGS.announcements];
  $("#ann").innerHTML=a.map(t=>`<span>${esc(t).toUpperCase()}</span>`).join("");
  const words=(CFG.ticker.words||[]).map(esc);
  $("#tick").innerHTML=[...words,...words,...words,...words].map((w,i)=>i%2?`<em>${w}</em>`:`<span>${w}</span>`).join("<span>—</span>");
  $("#aboutTxt").textContent=SETTINGS.about; $("#fAbout").textContent=CFG.footer.about;
  const c=SETTINGS.contact;
  $("#contact").innerHTML=[c.email&&`<span>${esc(c.email)}</span>`,c.phone&&`<span>${esc(c.phone)}</span>`,c.address&&`<span>${esc(c.address)}</span>`].filter(Boolean).join("")||"";
}

/* ---------- collection ---------- */
let state={cat:"all",sort:"new",avail:"",q:""};
function drawCats(){
  const used=new Set(PRODUCTS.map(p=>p.category));
  $("#cats").innerHTML=SETTINGS.categories.filter(c=>c.id==="all"||used.has(c.id)).map(c=>`<button class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.name}</button>`).join("");
}
function drawGrid(){

}
function applyFooter(){
  const c=CFG.contact,li=[["instagram",c.instagram],["facebook",c.facebook],["tiktok",c.tiktok],["youtube",c.youtube]].filter(x=>x[1]).map(x=>`<li><a href="${esc(safeUrl(x[1]))}" target="_blank" rel="noopener">${esc(T(x[0]))}</a></li>`);
  if(c.whatsapp)li.push(`<li><a href="https://wa.me/${esc(String(c.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${esc(T("whatsapp"))}</a></li>`);
  $("#follow").innerHTML=li.join("");
  $("#fcontact").innerHTML=[c.email&&`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,c.phone&&`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`,c.address&&esc(c.address)].filter(Boolean).map(x=>`<li>${x}</li>`).join("");
}
const PREVIEW=/[?&]preview/.test(location.search);
function applyAll(){
  buildSettings();applyTheme();applyTexts();applySettings();applyLayers();applyBanner();applyFooter();drawSale();drawCats();drawGrid();drawCart();
  applySections();applyMotion();maskHeadings();observe();
}
addEventListener("message",e=>{
  if(e.source!==window.parent||!e.data)return;
  if(e.data.raasPreview){CFG=window.RAAS_merge(D,e.data.raasPreview);applyAll()}
  if("raasScroll" in e.data){const el=e.data.raasScroll?document.querySelector(e.data.raasScroll):null;
    if(el&&el.offsetParent)el.scrollIntoView({behavior:"smooth",block:"start"});else scrollTo({top:0,behavior:"smooth"})}
});

/* init */
const t0=Date.now();
(async()=>{
  await loadData();applyAll();
  setTimeout(reveal,PREVIEW||RM.matches||CFG.motion.loader===false?0:Math.max(0,(+CFG.motion.loaderMs||0)-(Date.now()-t0)));
})();
</script>
</body>
</html>
